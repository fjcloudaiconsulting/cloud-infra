---
# Ported from the first-boot script of the old Lightsail node (INFRA-80).

# 2 GB swap. Under kubelet's default NoSwap behaviour pods do not use it; it absorbs memory
# pressure from k3s itself and the OS, so the kernel does not OOM-kill the control plane.
- name: Create the swap file, readable by root only
  ansible.builtin.shell: fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
  args:
    creates: /swapfile

- name: Enable swap at boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0

- name: Read the active swap devices
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: node_base_swaps
  changed_when: false
  check_mode: false

- name: Enable swap now
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in node_base_swaps.stdout_lines"
  changed_when: true

# Security updates only (the Ubuntu default origins), no automatic reboot: a reboot restarts
# the databases, so it stays a deliberate act.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Run unattended-upgrades daily, never rebooting
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";

# Key-only SSH. Root keeps key login because Ansible connects as root. sshd keeps the first
# value it reads and the drop-ins load in name order, so 10- wins over the image's 50-cloud-init.conf.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# Root's authorized_keys is exactly the deploy keys: the public key next to ansible_ssh_private_key_file on this
# machine plus deploy_ssh_extra_public_keys (group_vars/all.yml). Hetzner writes a key only when a server is created,
# so without this a replaced key, or one added by hand, would stay valid. Run with --check --diff first (README.md).
- name: Collect the deploy public keys
  ansible.builtin.set_fact:
    node_base_root_keys: "{{ [lookup('ansible.builtin.file', (ansible_ssh_private_key_file | expanduser) ~ '.pub')] + deploy_ssh_extra_public_keys }}"

- name: The deploy public keys are well-formed
  ansible.builtin.assert:
    that:
      - node_base_root_keys | length > 0
      - node_base_root_keys | reject('match', node_base_ssh_key_pattern) | list | length == 0
    fail_msg: >-
      Not writing root's authorized_keys: each deploy key must be one line, "ssh-ed25519 AAAA..." or
      "sk-ssh-ed25519@openssh.com AAAA...", with an optional comment.
    quiet: true

- name: Read root's authorized keys
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: node_base_authorized_keys

# Lockout guard: the exclusive write below keeps the key this run connects with, so that key must already work.
- name: The key Ansible connects with is already authorized
  ansible.builtin.assert:
    that: (node_base_root_keys[0].split()[:2] | join(' ')) in (node_base_authorized_keys.content | b64decode)
    fail_msg: >-
      Not writing root's authorized_keys on {{ inventory_hostname }}: {{ ansible_ssh_private_key_file }}.pub is not
      among its keys. Check that the .pub file belongs to that private key.
    quiet: true

- name: Root accepts only the deploy keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ node_base_root_keys | join('\n') }}"
    exclusive: true

# A network attached after first boot is missing from cloud-init's 50-cloud-init.yaml, so its NIC stays down.
# Netplan merges the same interface ID across files: where cloud-init already lists the NIC (by MAC, dhcp4),
# this adds nothing new.
- name: Configure the private NIC for DHCP
  ansible.builtin.copy:
    dest: /etc/netplan/60-private.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      network:
        version: 2
        ethernets:
          {{ private_nic }}:
            dhcp4: true
  notify: Bring up the private NIC

- name: Apply pending network and sshd changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for the private NIC to carry the private IP
  when: not ansible_check_mode
  ansible.builtin.command: ip -4 -o addr show dev {{ private_nic }}
  register: node_base_private_addr
  until: (private_ip ~ '/') in node_base_private_addr.stdout
  retries: 12
  delay: 5
  changed_when: false
