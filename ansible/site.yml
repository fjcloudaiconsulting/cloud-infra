---
# Hetzner hosts (INFRA-64): base config on every host, the database volume on db-1, then k3s HA.
# Runbook: README.md. Run from this directory.

- name: Refuse placeholder addresses
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: The inventory holds real addresses
      ansible.builtin.assert:
        that: ansible_host is not match('192\.0\.2\.')
        fail_msg: "{{ inventory_hostname }} still has the placeholder {{ ansible_host }}; set its real IPv4 in inventory.yaml."
        quiet: true

- name: Base configuration
  hosts: all
  roles:
    - role: node_base

# Before the k3s play, so the mount guard exists before k3s is first installed or started.
- name: Database volume
  hosts: db
  any_errors_fatal: true
  roles:
    - role: db_storage

# One server at a time and stop at the first failure, so the etcd quorum (2 of 3) is never at risk.
# The very first bootstrap runs the three servers as one batch: the collection's join check waits
# for every server, which a one-host batch can never satisfy on an empty cluster.
- name: K3s servers
  hosts: server
  serial: "{{ (k3s_bootstrap | default(false) | bool) | ternary('100%', 1) }}"
  max_fail_percentage: 0
  # The collection writes the token into config.yaml; no diff may print it.
  diff: false
  pre_tasks:
    # Without kubectl here the collection silently skips fetching the admin kubeconfig, which the cluster CA is read
    # from (post_tasks).
    - name: Kubectl is installed on this machine
      run_once: true
      delegate_to: localhost
      become: false
      ansible.builtin.command: kubectl version --client
      changed_when: false
      check_mode: false

    - name: Look for existing etcd data
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db/etcd
      register: k3s_etcd_dir

    # The collection restarts every running server on every run, so a steady-state run skips it: it runs only to
    # bootstrap, to install a new or rebuilt node, or when asked to apply changed k3s settings. Versions move
    # through system-upgrade-controller (INFRA-179), not this play.
    - name: Decide whether this run installs or reconfigures k3s
      ansible.builtin.set_fact:
        k3s_apply: "{{ (k3s_bootstrap | bool) or (k3s_reconfigure | default(false) | bool) or not k3s_etcd_dir.stat.exists }}"

    - name: Say why k3s is left alone
      when: not k3s_apply | bool
      ansible.builtin.debug:
        msg: >-
          k3s is installed on {{ inventory_hostname }}; skipping it. Pass -e k3s_reconfigure=true to apply
          changed k3s settings (restarts each server, one at a time).

    # Quorum guard: restarting an etcd member while another server is down or out of the run drops etcd to 1 of 3.
    # ansible_play_hosts drops hosts that failed or were unreachable in any earlier play.
    - name: Every server is in this run and reachable
      when: k3s_apply | bool and k3s_etcd_dir.stat.exists
      ansible.builtin.assert:
        that: groups['server'] | difference(ansible_play_hosts) | length == 0
        fail_msg: >-
          Not restarting {{ inventory_hostname }}: {{ groups['server'] | difference(ansible_play_hosts) | join(', ') }}
          failed, was unreachable or was left out by --limit. Fix that server first; only a rebuilt node (no etcd data) runs alone.

    # Node Ready can be stale for the node-monitor grace period and says nothing about etcd, so ask every
    # server's own apiserver for its etcd health too.
    - name: Read etcd health on every server
      when: k3s_apply | bool and k3s_etcd_dir.stat.exists
      ansible.builtin.command: k3s kubectl get --raw /readyz/etcd
      delegate_to: "{{ item }}"
      loop: "{{ groups['server'] }}"
      register: k3s_peers_etcd
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Etcd is healthy on every server
      when: k3s_apply | bool and k3s_etcd_dir.stat.exists
      ansible.builtin.assert:
        that: k3s_peers_etcd.results | rejectattr('stdout', 'equalto', 'ok') | list | length == 0
        fail_msg: >-
          Not restarting {{ inventory_hostname }}: /readyz/etcd is not ok on
          {{ k3s_peers_etcd.results | rejectattr('stdout', 'equalto', 'ok') | map(attribute='item') | join(', ') }}.

    - name: Read the server nodes' Ready status
      when: k3s_apply | bool and k3s_etcd_dir.stat.exists
      ansible.builtin.command: >-
        k3s kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
      register: k3s_nodes_ready
      changed_when: false
      check_mode: false

    - name: Every server node is Ready
      when: k3s_apply | bool and k3s_etcd_dir.stat.exists
      ansible.builtin.assert:
        that: groups['server'] | map('regex_replace', '$', '=True') | difference(k3s_nodes_ready.stdout_lines) | length == 0
        fail_msg: "Not restarting {{ inventory_hostname }}: not every server is Ready ({{ k3s_nodes_ready.stdout_lines | join(', ') }})."

    - name: The private NIC carries the private IP
      ansible.builtin.assert:
        that: ansible_facts[private_nic].ipv4.address | default('') == private_ip
        fail_msg: "{{ private_nic }} does not carry {{ private_ip }} on {{ inventory_hostname }}; set private_nic."
        quiet: true

    # Split-brain guard: cluster-init on an empty disk starts a second, separate cluster.
    - name: Bootstrap only an empty cluster, with every server in the run
      when: k3s_bootstrap | bool
      run_once: true
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | sort == groups['server'] | sort
          - groups['server'] | map('extract', hostvars, ['k3s_etcd_dir', 'stat', 'exists']) | select | list | length == 0
        fail_msg: >-
          k3s_bootstrap=true is only for the first bootstrap: run it without --limit and only while no server
          has etcd data. To rebuild a node, run without k3s_bootstrap so it joins a live peer.

    - name: A new server can reach the peer it joins
      when:
        - not k3s_bootstrap | bool
        - not k3s_etcd_dir.stat.exists
      ansible.builtin.wait_for:
        host: "{{ k3s_join_peer }}"
        port: 6443
        timeout: 30
        msg: >-
          No k3s API at {{ k3s_join_peer }}:6443 for {{ inventory_hostname }} to join. For the very first
          bootstrap of an empty cluster pass -e k3s_bootstrap=true; otherwise bring that peer back first.

    # config.yaml (0644, written by the collection) holds the token; a 0700 parent keeps it root-only.
    - name: Keep /etc/rancher root-only
      ansible.builtin.file:
        path: /etc/rancher
        state: directory
        owner: root
        group: root
        mode: "0700"

    # The API server reads its audit policy at start (kube-apiserver-arg in group_vars/all.yml), so it is in place
    # before k3s is first installed; a changed policy takes effect on the next -e k3s_reconfigure=true run.
    # 0755 as the collection makes it.
    - name: The k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"
      register: k3s_config_dir

    # In check mode on a new server the directory is not there yet, so the copy has nothing to compare with.
    - name: Install the API audit policy
      when: not ansible_check_mode or k3s_config_dir is not changed
      ansible.builtin.copy:
        src: k3s-audit-policy.yaml
        dest: "{{ k3s_audit_policy_file }}"
        owner: root
        group: root
        mode: "0600"

    # The API server also reads its Pod Security defaults at start (admission-control-config-file in
    # group_vars/all.yml) and does not start without the file, so it is in place before k3s is installed or restarted.
    - name: Install the Pod Security admission defaults
      when: not ansible_check_mode or k3s_config_dir is not changed
      ansible.builtin.copy:
        src: k3s-pod-security.yaml
        dest: "{{ k3s_psa_config_file }}"
        owner: root
        group: root
        mode: "0600"

    # The collection only downloads get.k3s.io when this file is absent, so this pinned installer is the one it runs:
    # install.sh at a k3s tag's commit, checked against its sha256 (both in group_vars/all.yml).
    - name: Install the pinned k3s installer
      when: k3s_apply | bool
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_install_sh_commit }}/install.sh
        checksum: sha256:{{ k3s_install_sh_sha256 }}
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: "0755"
        force: true

  roles:
    # prereq (forwarding sysctls, packages) never restarts k3s, so it runs every time and corrects drift.
    - role: k3s.orchestration.prereq
    # The role passes the token through task arguments and set_fact results; -v would print them.
    # -e k3s_no_log=false to debug a failing role (and then never share the output).
    - role: k3s.orchestration.k3s_server
      when: k3s_apply | bool
      no_log: "{{ k3s_no_log | default(true) }}"

  post_tasks:
    # Both gates, in this order: node Ready alone can be a stale status (about 40 s) from before the restart,
    # while /readyz/etcd comes from this node's own, restarted apiserver (k3s kubectl talks to 127.0.0.1).
    - name: Wait for this node's etcd to be healthy
      when: not ansible_check_mode
      ansible.builtin.command: k3s kubectl get --raw /readyz/etcd
      register: k3s_etcd_ready
      until: k3s_etcd_ready.rc == 0 and k3s_etcd_ready.stdout == 'ok'
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for this node to be Ready
      when: not ansible_check_mode
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=30s
      register: k3s_node_ready
      until: k3s_node_ready.rc == 0
      retries: 20
      delay: 10
      changed_when: false

    # The fetched kubeconfig's client certificate is system:masters, which no RBAC change revokes, so only its cluster
    # CA is kept (the owner's kubeconfig names it: docs/runbooks.md, Hetzner cluster bootstrap step 6). Break-glass is
    # `k3s kubectl` over SSH, which needs no copy here.
    - name: Keep only the cluster CA from the fetched admin kubeconfig
      when: (kubeconfig | expanduser) is file
      run_once: true
      delegate_to: localhost
      become: false
      block:
        - name: Write the cluster CA next to the kubeconfig
          ansible.builtin.copy:
            dest: "{{ kubeconfig_ca | expanduser }}"
            content: "{{ (lookup('ansible.builtin.file', kubeconfig | expanduser) | from_yaml).clusters[0].cluster['certificate-authority-data'] | b64decode }}"
            mode: "0600"

        - name: Delete the fetched admin kubeconfig
          ansible.builtin.file:
            path: "{{ kubeconfig | expanduser }}"
            state: absent
