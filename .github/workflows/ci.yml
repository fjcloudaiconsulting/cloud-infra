name: CI

on:
  pull_request:
  push:
    # Staging bumps automerge as branches without a PR (INFRA-36): CI must report checks there.
    branches: [main, "renovate/ziftbook-staging-**", "renovate/tbd-staging-**"]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main runs; superseded PR and Renovate branch runs are safe to drop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: changed paths
        # A required check, so the job always reports; PRs that touch no Terraform skip the Terraform steps.
        # Pushes (main, Renovate branches) run everything.
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$BASE" HEAD)
            grep -qE '^(terraform/|\.tflint\.hcl$|\.github/workflows/ci\.yml$|\.github/scripts/check-tbd-backups-fences\.py$|aws/bootstrap/)' <<<"$changed" || exit 0
          fi
          echo terraform=true >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.changes.outputs.terraform == 'true'
        with:
          terraform_version: v1.16.6
      - name: fmt
        if: steps.changes.outputs.terraform == 'true'
        run: terraform fmt -check -recursive -diff
      - name: tbd-backups fences
        if: steps.changes.outputs.terraform == 'true'
        # Trust-anchor (TBD-372) and least-privilege policy checks, ported from tbd (INFRA-18).
        run: python3 .github/scripts/check-tbd-backups-fences.py
      - name: python tests
        # Backup probe and the SOPS secrets check.
        run: python3 -m unittest discover -s tests
      - name: validate every stack
        if: steps.changes.outputs.terraform == 'true'
        run: |
          set -uo pipefail
          # Every directory directly under terraform/ is a root stack; shared modules go elsewhere.
          rc=0
          for dir in terraform/*/; do
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            echo "::group::$dir"
            if ! { terraform -chdir="$dir" init -backend=false -input=false && terraform -chdir="$dir" validate; }; then
              echo "::error::validate failed in $dir"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: steps.changes.outputs.terraform == 'true'
        with:
          tflint_version: v0.64.0
      - name: tflint every stack
        if: steps.changes.outputs.terraform == 'true'
        env:
          # Plugin downloads hit the GitHub API; unauthenticated runs get rate-limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # --recursive resolves a relative --config per directory, so pass it absolute.
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  kubernetes:
    name: Kubernetes checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Schema repo commits (yannh/kubernetes-json-schema for built-in kinds, datreeio/CRDs-catalog), pinned so schemas
      # change only with a repo change. Bump by hand; tests/test_ci_fences.py keeps both pinned.
      K8S_SCHEMA_SHA: f7d855e49c34b039c9ef2196444910275e31e09e
      CRDS_CATALOG_SHA: d373c2da9702bc9509a004db83e57263fe3bdfc1
      # The kustomize release Flux's kustomize-controller embeds (v1.9.6 pins v5.8.1): bump it with a Flux upgrade.
      KUSTOMIZE_VERSION: v5.8.1
      KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every Secret is SOPS-encrypted
        # clusters/ Secrets and ansible/ *.sops.yaml vars files.
        run: python3 .github/scripts/check-sops-secrets.py clusters ansible
      - name: rendered manifests
        # GHA-03: render what Flux applies (offline, nothing decrypted) and check the objects; then the check's tests,
        # which fail here instead of skipping without kustomize.
        run: |
          set -euo pipefail
          curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/$KUSTOMIZE_VERSION/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "$KUSTOMIZE_SHA256  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          export KUSTOMIZE="$PWD/kustomize" RENDER_CHECK_REQUIRED=1
          python3 .github/scripts/check-rendered-manifests.py clusters
          python3 -m unittest discover -s tests -p test_render_check.py
      - name: prod tags not ahead of staging
        # INFRA-89: every <app>-prod image tag must be <= the same app's <app>-staging tags.
        run: python3 .github/scripts/check-prod-tags.py clusters
      - name: image provenance
        # INFRA-107: every app image ref this change adds must be pinned by digest and attested by build-image on main.
        env:
          GH_TOKEN: ${{ github.token }}
          # PR: its base; Renovate branch push: main; push to main: the commit before the push.
          BASE: ${{ github.event.pull_request.base.sha || (github.ref_name != 'main' && 'origin/main') || github.event.before }}
        run: |
          # gh resolves oci:// through the docker credential store.
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          bash .github/scripts/check-image-provenance.sh
      - name: kubeconform
        run: |
          set -euo pipefail
          curl -fsSLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform
          # No published schema for CRDs themselves (they come from `flux install --export`);
          # Flux custom resources validate against the CRDs catalog. Non-strict: SOPS adds a sops: field.
          ./kubeconform -summary -kubernetes-version 1.36.0 -skip CustomResourceDefinition \
            -ignore-filename-pattern 'kustomization\.yaml$' \
            -schema-location "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/$K8S_SCHEMA_SHA/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/$CRDS_CATALOG_SHA/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            clusters/
