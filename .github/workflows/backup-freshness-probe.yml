# Detect SILENCE in the off-host database backups.
#
# ⚠ WHY THIS LIVES IN CI AND NOT ON THE DROPLET. An alert emitted by the machine
# being backed up cannot fire when that machine is gone, or when its cron never
# ran -- which is precisely the disaster the backup exists for. The failure mode
# is silence, and only an off-host observer can read silence. The machine's only
# obligations are to fail loudly into its log and never to upload a bad artifact.
#
# ⚠ CANNOT READ A CUSTOMER'S DATA. The probe's token is read-only and the dumps
# are encrypted to the owner's offline key before upload; the probe looks only at
# the listing (names, sizes, times), never at an object.
name: Backup Freshness Probe

on:
  schedule:
    # 04:17 UTC. The dump runs at 02:00 UTC, so this leaves ~2.3h of slack.
    # Odd minute, off the top of the hour, where the scheduler queue is shortest.
    - cron: "17 4 * * *"
  workflow_dispatch:
  # Self-test: a change to the probe proves the probe still runs, rather than
  # waiting until the next firing to discover it was broken.
  push:
    branches: [main]
    paths:
      - .github/workflows/backup-freshness-probe.yml
      - .github/scripts/check-backup-freshness.sh
      - .github/scripts/notify-backup-stale.sh

concurrency:
  group: backup-freshness-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Backup Freshness
    runs-on: ubuntu-26.04
    # The R2 secrets are environment secrets: only main may deploy to backup-probe, so a workflow on another branch
    # cannot read them (the role this replaced trusted refs/heads/main only).
    environment: backup-probe
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read-only bucket token and endpoint as secrets: GitHub masks them in the public run log.
      - name: Check backup freshness
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PROBE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PROBE_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
        run: |
          set -uo pipefail
          if [[ -z "$R2_ENDPOINT" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "verdict=could-not-run" >> "$GITHUB_OUTPUT"
            echo "detail=the probe's secrets are not set (docs/runbooks.md, Backups to R2)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Masking covers the whole secret only: mask the host and the account id too, which an error may print alone.
          host=${R2_ENDPOINT#https://}; host=${host%%/*}
          echo "::add-mask::$host"; echo "::add-mask::${host%%.*}"
          # ⚠ The listing and the verdict are separate steps on purpose: a listing
          # failure here must read as "could not run" (exit 2), not as "stale",
          # and must not be mistaken for a healthy empty bucket.
          # One listing per prefix, merged into one document. prefix=minimum dump bytes:
          # - floors are about 40% of a real dump (tbd-mysql, tbd-staging-mysql, ziftbook-postgres,
          #   ziftbook-prod-postgres: the backup CronJob's sets).
          floors="tbd-mysql=100000 tbd-staging-mysql=5000 ziftbook-postgres=5000 ziftbook-prod-postgres=5000"
          for spec in $floors; do
            if ! aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket db-backups \
                  --prefix "${spec%%=*}/" --output json > "list-${spec%%=*}.json" 2>err.txt; then
              # The error goes to the run log only (secrets masked), never into the public issue.
              head -c 300 err.txt >&2
              echo "verdict=could-not-run" >> "$GITHUB_OUTPUT"
              echo "detail=listing ${spec%%=*}/ failed; see the run log." >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          set +e
          # $floors unquoted on purpose: one argument per prefix. A jq failure
          # leaves the probe an empty listing, which exits 2 (could not run).
          detail="$(jq -s '{Contents: (map(.Contents // []) | add), IsTruncated: any(.[]; .IsTruncated == true)}' list-*.json \
                    | bash .github/scripts/check-backup-freshness.sh $floors 2>&1)"
          rc=$?
          set -e
          case "$rc" in
            0) echo "verdict=fresh" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=stale" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=could-not-run" >> "$GITHUB_OUTPUT" ;;
          esac
          # Random delimiter: detail echoes S3 keys, which may contain newlines. A builtin, so it
          # cannot fail after the verdict is written and skip the alarm.
          eof="DETAIL_EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "detail<<$eof"
            printf '%s\n' "$detail"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$detail"

      # ⚠ "could not run" RAISES THE ALARM, it does not merely fail the job.
      # A red scheduled workflow notifies essentially nobody, and nothing else
      # in this repo covers this signal. Fail closed INTO the alarm.
      - name: Raise the alarm
        if: steps.check.outputs.verdict != 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERDICT: ${{ steps.check.outputs.verdict }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: bash .github/scripts/notify-backup-stale.sh

      - name: Fail the job when the backup is not fresh
        if: steps.check.outputs.verdict != 'fresh'
        run: |
          echo "backup freshness verdict: ${{ steps.check.outputs.verdict }}" >&2
          exit 1

  # ⚠ GitHub disables scheduled workflows in a public repo after 60 days without
  # repository activity, and tbd no longer runs a second probe (INFRA-20). Force-
  # enabling this workflow on every run resets that counter (not documented by
  # GitHub; it is what community keepalive actions rely on), so a quiet cloud-infra
  # cannot silence the alarm. Its own job keeps actions: write away from the job
  # that holds the bucket token and issues: write.
  keepalive:
    name: Keep the schedule alive
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/${GH_REPO}/actions/workflows/backup-freshness-probe.yml/enable"
