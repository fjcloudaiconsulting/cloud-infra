name: Ansible

# Own workflow so it runs only when the playbook can change; not a required check, so a skipped run blocks nothing.
on:
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible.yml"]

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ansible:
    name: Ansible checks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ansible-core, ansible-lint and every dependency are pinned with the sha256 of each file PyPI has for them
      # (requirements-ci.txt, GHA-09): pip installs nothing unlisted or unhashed. Wheels only, so no sdist build runs
      # code or fetches unhashed build dependencies. pip still resolves the dependencies (no --no-deps), so a pin that
      # no longer fits the others fails here instead of installing a broken set.
      - name: install ansible
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet --require-hashes --only-binary :all: -r requirements-ci.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: install pinned collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: syntax check
        run: ansible-playbook site.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint
