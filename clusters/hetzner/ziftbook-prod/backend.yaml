# Ziftbook API in production (INFRA-82). Only the frontend talks to it (networkpolicy.yaml); the tunnel routes app.ziftbook.com to the frontend only.
# The migrate init container runs `alembic upgrade head` before every start (no-op at head, advisory-locked), so
# a new version never serves on an old schema. The worker runs the same init container.
# Images track vX.Y.Z only; Renovate bumps all three in one PR that is never automerged: merging it is the deploy (renovate.json).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ziftbook-prod
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ziftbook-prod
spec:
  replicas: 2
  # Recreate: every old pod is gone before a new one starts, so no version serves beside another (the smoke's version
  # match relies on it) and a rollout needs no surge room in the quota. Two replicas on two nodes (INFRA-177).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      # One replica per app node (INFRA-177), as cloudflared. The replacement for a pod on a drained or lost node stays
      # Pending until that node is back, while the other replica serves; it then lands there on its own.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: backend
      # Leave a lost node after 30 s, not the default 300 s (INFRA-177). Effect NoExecute only: tolerating the NoSchedule
      # taint too would let a replacement schedule onto the dead node.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        runAsUser: 10001 # app in the image; runAsNonRoot cannot check a named user
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/fjcloudaiconsulting/ziftbook/migrations:v0.27.0@sha256:dac3c04f6125dea3859bce81a4680128018cd908e89315cb68465e4d6267a6c9
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            - name: ZIF_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook
                  key: migrate-database-url
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/fjcloudaiconsulting/ziftbook/backend:v0.27.0@sha256:592831b13118f55d53d20457eb202e107d934eab8be0d47b3d57ce82b41cf169
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            # Stripe's onboarding return/refresh URLs and the Apple Pay domain (payments.py); same value as the worker's.
            - name: ZIF_APP_URL
              value: https://app.ziftbook.com
            # Encrypts the admins' TOTP secrets (ZIF-71). Losing it makes every enrolled second factor unreadable, so it is
            # never rotated casually; the SOPS file in git is its backup. optional: unset only disables admin TOTP (503).
            - name: ZIF_TOTP_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-totp
                  key: key
                  optional: true
            # First-run setup (ZIF-70): with no user in the database every page redirects to /setup, which takes this
            # token (32+ characters) once. Works only while there are no users; delete the Secret after setup.
            - name: ZIF_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ziftbook-setup
                  key: token
                  optional: true
            # The migrate role's credentials stay in the init container.
            - name: ZIF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook
                  key: database-url
            # Service photos in R2 (ZIF-133, docs/runbooks.md "R2 for Ziftbook photos"). EU buckets answer only on the .eu
            # endpoint. The env's own R2 token is in Secret ziftbook-storage; optional: uploads answer 503 until it exists.
            # ZIF_S3_UPLOADS_BUCKET is left out on purpose until ziftbook 0.31.0 (ZIF-214): photo uploads answer 503.
            - name: ZIF_S3_MEDIA_BUCKET
              value: ziftbook-media-prod
            - name: ZIF_MEDIA_URL
              value: https://img.ziftbook.com
            - name: ZIF_S3_ENDPOINT
              value: https://fb5eb042529f2621c6de3f34c6801174.eu.r2.cloudflarestorage.com
            - name: ZIF_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: access-key-id
                  optional: true
            - name: ZIF_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: secret-access-key
                  optional: true
            # X-Forwarded-For is believed only from pods: the frontend sets it from cf-connecting-ip, and
            # networkpolicy.yaml admits only the frontend. Cluster CIDR, not the node's podCIDR, which changes
            # if the node re-registers. Node-local traffic (source 10.42.0.1) is owner-only (NetBird).
            - name: ZIF_TRUSTED_PROXIES
              value: 10.42.0.0/16
            # Turnstile widget `ziftbook-prod` (hostname app.ziftbook.com, made by hand, ZIF-116). Without the secret the API
            # refuses every public booking and logs an ERROR at start (fail closed), so optional only spares the pod.
            - name: ZIF_TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ziftbook-turnstile
                  key: secret
                  optional: true
          # Keep serving while the endpoint removal reaches cloudflared and kube-proxy, so an eviction drops no requests.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi # image decode at Save: 152 MB baseline plus up to 83 MB (ZIF-133)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# A drain evicts one replica at a time (INFRA-177). AlwaysAllow: a crash-looping replica never blocks a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: ziftbook-prod
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: backend
