# Ziftbook background worker in production (INFRA-82): the backend image, polling Postgres for jobs.
# 90s grace lets in-flight jobs finish on SIGTERM (compose stop_grace_period). Mail goes out through the Mailgun
# HTTP API (INFRA-47 wiring, ZIF-151 code); the key is in its own Secret ziftbook-mailgun (api-key), so it can be
# written with the public SOPS key alone and rotated without touching the ziftbook Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ziftbook-prod
spec:
  replicas: 1
  # One worker at a time, and no surge over the quota.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      # Leave a lost node after 30 s, not the default 300 s (INFRA-177). Effect NoExecute only: tolerating the NoSchedule
      # taint too would let a replacement schedule onto the dead node.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/fjcloudaiconsulting/ziftbook/migrations:v0.31.0@sha256:893fe4e97caa0c9fd0e54c9e0ea70834ce4f2ddbd29ffb212316ae3627e2afe1
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            - name: ZIF_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook
                  key: migrate-database-url
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: worker
          image: ghcr.io/fjcloudaiconsulting/ziftbook/backend:v0.31.0@sha256:ec754adc68119fd2095a47ead00b8dd7eb9f5eed46d78296ff650d94dcc5f7cf
          command: [python, -m, app.worker]
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            # Its own database role (ZB-08): it logs in as ziftbook_prod_worker, which runs as ziftbook_worker (every
            # privilege of ziftbook_app plus minting the email tokens; data/postgres-bootstrap-prod.yaml). Its own Secret,
            # apart from the API's `ziftbook`: an API given this URL could mint tokens itself.
            - name: ZIF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook-worker-database
                  key: database-url
            # The backend's rate-limit pepper (ZB-25): the worker's per-recipient email limits are keyed with it too.
            - name: ZIF_RATE_LIMIT_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-rate-limit
                  key: rate-limit-key
            - name: ZIF_APP_URL # email links; the backend reads it too
              value: https://app.ziftbook.com
            # Mailgun HTTP API like TBD: EU region, production sending domain m.ziftbook.com (own sending key; domain and key are made by hand, runbooks.md "Mail"). Only the worker sends mail. optional: the worker keeps
            # running before the owner adds the key.
            - name: ZIF_MAILGUN_DOMAIN
              value: m.ziftbook.com
            - name: ZIF_MAILGUN_REGION
              value: eu
            - name: ZIF_MAILGUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-mailgun
                  key: api-key
                  optional: true
            # Dead-man's switch (ZIF-21): the worker GETs this Healthchecks.io ping URL after each good loop (about 30 s), and
            # the check alerts when pings stop. Its own Secret like ziftbook-mailgun; optional, so the worker runs without it.
            - name: ZIF_HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook-healthcheck
                  key: url
                  optional: true
            # Service photos in R2 (ZIF-133, docs/runbooks.md "R2 for Ziftbook photos"). EU buckets answer only on the .eu
            # endpoint. The env's own R2 token is in Secret ziftbook-storage; optional: uploads answer 503 until it exists.
            - name: ZIF_S3_UPLOADS_BUCKET
              value: ziftbook-uploads-prod
            - name: ZIF_S3_MEDIA_BUCKET
              value: ziftbook-media-prod
            - name: ZIF_MEDIA_URL
              value: https://img.ziftbook.com
            - name: ZIF_S3_ENDPOINT
              value: https://fb5eb042529f2621c6de3f34c6801174.eu.r2.cloudflarestorage.com
            - name: ZIF_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: access-key-id
                  optional: true
            - name: ZIF_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: secret-access-key
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
