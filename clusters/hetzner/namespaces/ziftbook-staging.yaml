# Ziftbook staging (INFRA-46, on Hetzner since INFRA-173). The PriorityClass `staging` is cluster-scoped and defined
# once, in priorityclass-staging.yaml (two files would give one object two owners).
apiVersion: v1
kind: Namespace
metadata:
  name: ziftbook-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ziftbook-staging
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: ziftbook-staging
spec:
  hard:
    # backend, worker, frontend: 3 x 128Mi requests (INFRA-46); limits 384Mi + 2 x 256Mi = 896Mi (backend 384Mi since
    # ZIF-133). Every Deployment uses Recreate, so a rollout never needs room for a second pod.
    requests.memory: 512Mi
    limits.memory: 1Gi
---
# Rejects any pod in this namespace that does not use the staging class, Job and CronJob
# pods included (they fail with a FailedCreate event only).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-class-only
  namespace: ziftbook-staging
spec:
  hard:
    pods: "0"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values: [staging]
---
# Every pod here pulls private GHCR images with ghcr-pull (ziftbook-staging-ghcr-pull.secret.yaml), so
# workloads need no imagePullSecrets of their own. Until the secret exists the kubelet logs a
# warning and pulls anonymously; public images still work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ziftbook-staging
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
imagePullSecrets:
  - name: ghcr-pull
# No app calls the Kubernetes API: a pod here (a debug pod or a Job too) gets no token unless its own spec asks for
# one (K8S-06). The Deployments set the same at pod level.
automountServiceAccountToken: false
