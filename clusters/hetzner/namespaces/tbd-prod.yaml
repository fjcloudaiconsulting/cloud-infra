# TBD production (INFRA-43, on Hetzner since INFRA-175). No priority class: it never yields to staging.
apiVersion: v1
kind: Namespace
metadata:
  name: tbd-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tbd-prod
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: tbd-prod
spec:
  hard:
    # 2 x backend 256/384, scheduler 160/320, 2 x frontend 128/256 = 928Mi/1600Mi (INFRA-177). The migrate init
    # container (96/256) is counted at the larger of init and app containers; Recreate never needs a surge pod.
    # Twice that: pods on a lost node keep counting until the quota's 5-minute resync, while their replacements (Pending
    # under the anti-affinity, or running for the scheduler) count too.
    requests.memory: 1856Mi
    limits.memory: 3200Mi
---
# Every pod here pulls private GHCR images with ghcr-pull (tbd-prod-ghcr-pull.secret.yaml), so
# workloads need no imagePullSecrets of their own. Until the secret exists the kubelet logs a
# warning and pulls anonymously; public images still work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tbd-prod
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
imagePullSecrets:
  - name: ghcr-pull
# No app calls the Kubernetes API: a pod here (a debug pod or a Job too) gets no token unless its own spec asks for
# one (K8S-06). The Deployments set the same at pod level.
automountServiceAccountToken: false
