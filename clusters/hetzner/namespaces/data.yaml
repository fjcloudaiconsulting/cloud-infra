# MySQL (TBD), Postgres (Ziftbook) and their backup job; the databases run on db-1 (role=db). No Valkey here:
# INFRA-122 removes it before tbd-prod moves.
apiVersion: v1
kind: Namespace
metadata:
  name: data
  annotations:
    # Never deleted by Flux: pruning it would take the database volumes with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: data
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: data
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1536Mi
---
# Nothing in this namespace talks to the Kubernetes API, so its pods start without a token (K8S-06).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: data
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
automountServiceAccountToken: false
