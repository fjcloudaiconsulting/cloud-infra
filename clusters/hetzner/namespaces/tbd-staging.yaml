# TBD staging (INFRA-67, on Hetzner since INFRA-173), same pattern as ziftbook-staging. The PriorityClass `staging` is
# cluster-scoped and defined once, in priorityclass-staging.yaml (two files would give one object two owners).
apiVersion: v1
kind: Namespace
metadata:
  name: tbd-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tbd-staging
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: tbd-staging
spec:
  hard:
    # backend 128/384, frontend 96/256 (no Valkey since INFRA-173), mcp 96/256 (INFRA-147): 320Mi requests, 896Mi
    # limits, plus 64Mi of each for a debug pod (it must set limits.memory <= 64Mi: the LimitRange default is 256Mi).
    # Recreate everywhere, and the migrate init container (96/256) fits inside the backend's own figures.
    requests.memory: 384Mi
    limits.memory: 960Mi
---
# Rejects any pod in this namespace that does not use the staging class, Job and CronJob
# pods included (they fail with a FailedCreate event only).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-class-only
  namespace: tbd-staging
spec:
  hard:
    pods: "0"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values: [staging]
---
# Every pod here pulls private GHCR images with ghcr-pull (tbd-staging-ghcr-pull.secret.yaml), so
# workloads need no imagePullSecrets of their own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tbd-staging
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
imagePullSecrets:
  - name: ghcr-pull
# No app calls the Kubernetes API: a pod here (a debug pod or a Job too) gets no token unless its own spec asks for
# one (K8S-06). The Deployments set the same at pod level.
automountServiceAccountToken: false
