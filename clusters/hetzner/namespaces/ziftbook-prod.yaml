# Ziftbook production (INFRA-82, on Hetzner since INFRA-181). No priority class: it never yields to staging.
apiVersion: v1
kind: Namespace
metadata:
  name: ziftbook-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ziftbook-prod
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: ziftbook-prod
spec:
  hard:
    # 2 x backend, worker, 2 x frontend: 5 x 128Mi requests (INFRA-177); limits 2 x 384Mi + 3 x 256Mi = 1536Mi (backend
    # 384Mi since ZIF-133). Every Deployment uses Recreate, so a rollout never needs a surge pod. Twice that, as in
    # tbd-prod.yaml: pods on a lost node keep counting until the quota's 5-minute resync, while their replacements count too.
    requests.memory: 1280Mi
    limits.memory: 3Gi
---
# Every pod here pulls private GHCR images with ghcr-pull (ziftbook-prod-ghcr-pull.secret.yaml), so
# workloads need no imagePullSecrets of their own. Until the secret exists the kubelet logs a
# warning and pulls anonymously; public images still work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ziftbook-prod
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
imagePullSecrets:
  - name: ghcr-pull
# No app calls the Kubernetes API: a pod here (a debug pod or a Job too) gets no token unless its own spec asks for
# one (K8S-06). The Deployments set the same at pod level.
automountServiceAccountToken: false
