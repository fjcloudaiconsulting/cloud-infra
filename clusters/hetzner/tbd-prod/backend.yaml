# TBD API in production (INFRA-43). Secret tbd: tbd.secret.yaml, written by the owner.
# The migrate init container (the `migrations` image target, INFRA-39) runs `python /app/scripts/migrate.py`
# (alembic upgrade head) before every start, so a new version never serves on an old schema. A Job named by
# version cannot work under Flux (immutable pod template, no ordering before Deployments). Only this pod migrates;
# alembic env.py takes a MySQL GET_LOCK (INFRA-83), so a second migrator would wait, then find the work done.
# Images track vX.Y.Z only. Production bumps arrive as PRs and never automerge (renovate.json: the staging
# automerge rule matches ziftbook-staging paths only). Bump backend, migrations, scheduler and frontend together.
# On the Hetzner cluster since INFRA-175. Sessions and rate limits are in MySQL since tbd 0.296.0 (INFRA-122), so no Valkey.
# The scheduler loop is disabled here: it runs in scheduler.yaml (exactly one pod).
# PFV_RUNTIME is deliberately unset. CLIENT_IP_HEADER=cf-connecting-ip: Cloudflare overwrites that
# header, and the origin is reachable only through the Cloudflare Tunnel (no public port, no Traefik; same-node host traffic bypasses NetworkPolicy, see data/networkpolicy.yaml), so
# get_client_ip reads the visitor from it (INFRA-83). frontend.yaml sets the same value (INFRA-97).
# args repeats the image CMD (tbd backend/Dockerfile) with uvicorn's --forwarded-allow-ips narrowed from every private
# range to the pod network (k3s's default cluster CIDR): only cloudflared pods reach this port (networkpolicy.yaml), and
# uvicorn reads X-Forwarded-For and X-Forwarded-Proto from them only (INF-01). A tbd release that changes that CMD
# needs the same change here, in tbd-staging/backend.yaml and in tbd-staging/mcp.yaml.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tbd-prod
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tbd-prod
spec:
  replicas: 2
  # Recreate: every old pod is gone before a new one starts, so no version serves beside another (the smoke's version
  # match relies on it) and a rollout needs no surge room in the quota. Two replicas on two nodes (INFRA-177).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      # One replica per app node (INFRA-177), as cloudflared. The replacement for a pod on a drained or lost node stays
      # Pending until that node is back, while the other replica serves; it then lands there on its own.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: backend
      # Leave a lost node after 30 s, not the default 300 s (INFRA-177). Effect NoExecute only: tolerating the NoSchedule
      # taint too would let a replacement schedule onto the dead node.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        runAsUser: 1001 # backend in the image; runAsNonRoot cannot check a named user
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/fjcloudaiconsulting/tbd/migrations:v0.303.1@sha256:1c58238a6ae692706bf107aa29406f4f1154a84fcc768fb6ce663be663f43080
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: jwt-secret-key
            - name: API_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: api-token-hmac-key
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/fjcloudaiconsulting/tbd/backend:v0.303.1@sha256:ea9da0610148213b1c775e363ba9bc2772e1d8dd6232b712ef8056e7a9a1c069
          args: [uvicorn, "app.main:app", --host, 0.0.0.0, --port, "8000", --ws, none, --proxy-headers, --forwarded-allow-ips, 10.42.0.0/16]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            - name: APP_ENV
              value: "production"
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
            # The same trust list for tbd images that read it from the environment (uvicorn and the rate limiter);
            # keep it equal to --forwarded-allow-ips in args until args is dropped (INF-01).
            - name: FORWARDED_ALLOW_IPS
              value: 10.42.0.0/16
            - name: LOG_LEVEL
              value: "INFO"
            - name: APP_URL
              value: "https://app.thebetterdecision.com"
            # The app origin only (FE-01): the apex and www are marketing pages that never call the API.
            - name: BACKEND_CORS_ORIGINS
              value: "https://app.thebetterdecision.com"
            - name: COOKIE_SECURE
              value: "true"
            - name: MAILGUN_DOMAIN
              value: "m.thebetterdecision.com"
            - name: MAILGUN_REGION
              value: "eu"
            - name: EMAIL_FROM
              value: "The Better Decision <noreply@m.thebetterdecision.com>"
            - name: AI_NATIVE_ENABLED
              value: "false"
            - name: AI_DISPATCH_TIMEOUT_S
              value: "30"
            - name: CAPTCHA_REQUIRED
              value: "true"
            - name: CAPTCHA_PROVIDER
              value: "turnstile"
            - name: CAPTCHA_VERIFY_URL
              value: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
            - name: CAPTCHA_VERIFY_TIMEOUT_S
              value: "5"
            - name: CAPTCHA_VERIFY_TOTAL_TIMEOUT_S
              value: "20"
            - name: CAPTCHA_EXPECTED_HOSTNAME
              value: "app.thebetterdecision.com"
            - name: CAPTCHA_EXPECTED_ACTION
              value: "register"
            - name: BILLING_UI_ENABLED
              value: "false"
            - name: FEATURE_REPORTS_V2
              value: "true"
            - name: FEATURE_PLANS
              value: "false"
            - name: FEATURE_CUSTOM_DASHBOARD
              value: "true"
            - name: SCHEDULER_ENABLED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: jwt-secret-key
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: mfa-encryption-key
            - name: AI_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: ai-credential-encryption-key
            - name: AI_CREDENTIAL_ENCRYPTION_KEY_PREV
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: ai-credential-encryption-key-prev
                  optional: true
            - name: API_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: api-token-hmac-key
            - name: MAILGUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: mailgun-api-key
            - name: MAILGUN_WEBHOOK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: mailgun-webhook-signing-key
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: google-client-secret
            - name: CAPTCHA_SECRET
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: captcha-secret
            - name: FOUNDER_COUNT_EXCLUDE_USERNAMES
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: founder-count-exclude-usernames
          # Keep serving while the endpoint removal reaches cloudflared and kube-proxy, so an eviction drops no requests.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi # near the working set, so staging (over its request sooner) is evicted first
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# A drain evicts one replica at a time (INFRA-177). AlwaysAllow: a crash-looping replica never blocks a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: tbd-prod
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: backend
