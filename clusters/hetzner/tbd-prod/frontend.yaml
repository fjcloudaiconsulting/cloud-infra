# TBD web (Next.js standalone) in production (INFRA-43). Serves app.thebetterdecision.com since the INFRA-48 cutover.
# Config is runtime-only since INFRA-40 (lib/runtime-config.ts reads TBD_* per request); the values below are the
# frontend's runtime config. Production bumps
# arrive as Renovate PRs and never automerge (renovate.json).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tbd-prod
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tbd-prod
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      # One replica per app node (INFRA-177), as cloudflared. The replacement for a pod on a drained or lost node stays
      # Pending until that node is back, while the other replica serves; it then lands there on its own.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: frontend
      # Leave a lost node after 30 s, not the default 300 s (INFRA-177). Effect NoExecute only: tolerating the NoSchedule
      # taint too would let a replacement schedule onto the dead node.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        runAsUser: 1001 # nextjs in the image; runAsNonRoot cannot check a named user
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/fjcloudaiconsulting/tbd/frontend:v0.302.0
          ports:
            - containerPort: 3000
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            # Server-side (RSC) fetches reach the backend directly; browsers use relative URLs through the Cloudflare Tunnel.
            - name: BACKEND_INTERNAL_URL
              value: http://backend:8000
            # Access-log client IP, same rule and value as backend.yaml (INFRA-97). Trustworthy because the origin has no public port,
            # the Cloudflare Tunnel sets cf-connecting-ip (same-node host traffic bypasses NetworkPolicy, see data/networkpolicy.yaml). Images before the INFRA-97 tbd release ignore it.
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
            # Exactly "true" shows "Sign in with Google" on /login and /register.
            - name: TBD_GOOGLE_SSO_ENABLED
              value: "true"
            # Turnstile site key (public), checked by the backend against CAPTCHA_EXPECTED_HOSTNAME.
            - name: TBD_CAPTCHA_SITE_KEY
              value: "0x4AAAAAADTu1HIFconXLShc"
          # Keep serving while the endpoint removal reaches cloudflared and kube-proxy, so an eviction drops no requests.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
# A drain evicts one replica at a time (INFRA-177). AlwaysAllow: a crash-looping replica never blocks a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: tbd-prod
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: frontend
