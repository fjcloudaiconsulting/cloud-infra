# NetBird peer that gives the owner kubectl access without any public port (INFRA-66), under
# the peer name hetzner-k3s. Rootless image: userspace WireGuard, no capabilities. With hostNetwork, traffic to
# the peer's NetBird IP is forwarded to the host's 127.0.0.1, so the API server (6443) is reachable. That forwarding
# exposes every loopback listener, so the NetBird access policy (terraform/netbird: owner devices -> k3s-hetzner, TCP
# 6443 only, one way) is the control that matters. Dashboard steps: docs/runbooks.md,
# Hetzner cluster bootstrap. It schedules on an app node (no role=db toleration); its state volume then pins it there.
# While that node is drained or down, access is SSH plus k3s kubectl on another server (runbooks.md, INFRA-177).
# Recovery if the state volume is lost: the setup key is single-use, so the pod crash-loops
# until a new key is SOPS-encrypted into setup-key.secret.yaml and merged.
# Delete the old peer in the NetBird dashboard first: otherwise it keeps the name hetzner-k3s (the kubeconfig's host)
# and its k3s-hetzner membership, and the new peer gets a suffixed name.
apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  annotations:
    # Never pruned by Flux: losing the state volume locks the owner out (see above).
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # hostNetwork is only allowed at privileged.
    pod-security.kubernetes.io/enforce: privileged
    # Report what goes beyond baseline (K8S-09): today only hostNetwork, so anything new stands out in the apply
    # warnings.
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbird-state
  namespace: netbird
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird
  namespace: netbird
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird
  template:
    metadata:
      labels:
        app: netbird
    spec:
      hostNetwork: true
      # Host resolver: break-glass access must not depend on CoreDNS.
      dnsPolicy: Default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netbird
          image: netbirdio/netbird:0.81.3-rootless@sha256:6ecdc46761656f2e724dd3daffed6bf48c2ea55fe5446c940e81295af188b3f9
          env:
            - name: NB_HOSTNAME
              value: hetzner-k3s
            # Console only: the default also writes a log file onto the state volume.
            - name: NB_LOG_FILE
              value: console
          envFrom:
            # NB_SETUP_KEY. Only used to enrol; the peer identity then lives on the volume.
            - secretRef:
                name: netbird-setup-key
          securityContext:
            allowPrivilegeEscalation: false
            # The client writes only to the state volume (config, state, daemon socket and, as the image user's home,
            # the CLI's ~/.config) and to /tmp (debug bundles and captures, on request), per upstream's
            # client/Dockerfile-rootless and client source at this tag (K8S-08). On an image bump, re-check that
            # Dockerfile's ENV paths: a write anywhere else now fails.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/netbird
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: netbird-state
        - name: tmp
          emptyDir: {}
---
# The owner's kubectl identity (tokens via `kubectl create token`). Revoke every token by
# deleting the account (Flux recreates it). Anyone who can create pods or tokens in this
# namespace holds cluster-admin: never grant namespace-scoped rights here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: owner-admin
  namespace: netbird
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: owner-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: owner-admin
    namespace: netbird
