# Telemetry standard (docs/architecture.md, Telemetry; INFRA-105) for the backend and the MCP server, read with envFrom.
# They name themselves tbd-api and tbd-mcp (the MCP server from TBD-649 on) and add service.version from the image. Alloy forwards metrics and traces, every trace (staging
# traffic is tiny; the standard SDK knobs OTEL_TRACES_SAMPLER/_ARG lower it); logs never leave over OTLP (stdout JSON
# only). The frontend and migrations do not read this.
# Read at container start: after an edit, restart the backend and mcp deployments.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel
  namespace: tbd-staging
data:
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=tbd,deployment.environment.name=staging
  # Alloy's staging receiver: only the staging namespaces reach 4319, and Alloy labels what arrives there staging.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.observability.svc:4319
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_PROPAGATORS: tracecontext
  OTEL_METRIC_EXPORT_INTERVAL: "60000"
  OTEL_METRICS_EXPORTER: otlp
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
