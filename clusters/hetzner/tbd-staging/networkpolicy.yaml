# Ingress to tbd-staging is deny-by-default. The only way in is the Cloudflare Tunnel (cloudflared namespace, INFRA-173;
# no Traefik on this cluster), to the frontend, the backend and MCP; the frontend makes no backend calls (INF-01). Egress
# is open except instance metadata.
# data/networkpolicy.yaml admits the backend and MCP to MySQL only. Node-local traffic bypasses these policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tbd-staging
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: tbd-staging
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: tbd-staging
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8000
---
# MCP (INFRA-147): the tunnel only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
  namespace: tbd-staging
spec:
  podSelector:
    matchLabels:
      app: mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8001
---
# Pods are listed separately because ipBlock is meant for addresses outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-no-imds
  namespace: tbd-staging
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
