# Ziftbook API on staging (INFRA-46). Only the frontend talks to it (networkpolicy.yaml); the tunnel routes dev.ziftbook.com to the frontend only.
# The migrate init container runs `alembic upgrade head` before every start (no-op at head, advisory-locked), so
# a new version never serves on an old schema. The worker runs the same init container.
# Images track vX.Y.Z only; Renovate bumps all three in one branch and automerges it (INFRA-36).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ziftbook-staging
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ziftbook-staging
spec:
  replicas: 1
  # Recreate: no surge pod, so a rollout never exceeds the namespace quota or opens a second DB pool.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      priorityClassName: staging
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001 # app in the image; runAsNonRoot cannot check a named user
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/fjcloudaiconsulting/ziftbook/migrations:v0.30.0@sha256:1ee4e3584a3d28f136177fba68d0867eb0400112fce2f6d112484926813c9dab
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            - name: ZIF_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook
                  key: migrate-database-url
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/fjcloudaiconsulting/ziftbook/backend:v0.30.0@sha256:2876ff118d175345efacc0fa62f80e27c6fc6179f208916bb84f9b095677108a
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            # Stripe's onboarding return/refresh URLs and the Apple Pay domain (payments.py); same value as the worker's.
            - name: ZIF_APP_URL
              value: https://dev.ziftbook.com
            # Encrypts the admins' TOTP secrets (ZIF-71). Losing it makes every enrolled second factor unreadable, so it is
            # never rotated casually; the SOPS file in git is its backup. optional: unset only disables admin TOTP (503).
            - name: ZIF_TOTP_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-totp
                  key: key
                  optional: true
            # Pepper for the rate-limit keys (ZB-25): the email or IP in each key is stored as its HMAC under it, so the
            # rate_limits table holds no addresses. One value per environment, the worker's too; changing it restarts every
            # counter once (docs/runbooks.md "Ziftbook rate-limit key"). Not optional: the Secret is in git.
            - name: ZIF_RATE_LIMIT_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-rate-limit
                  key: rate-limit-key
            # Stripe sandbox keys (ZIF-158, docs/runbooks.md "Ziftbook Stripe"). optional: unset turns payments off, the
            # app runs without them. The webhook route checks its own signature with the webhook secret.
            - name: ZIF_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-stripe
                  key: secret-key
                  optional: true
            - name: ZIF_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ziftbook-stripe
                  key: webhook-secret
                  optional: true
            - name: ZIF_STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-stripe
                  key: publishable-key
                  optional: true
            # The migrate role's credentials stay in the init container.
            - name: ZIF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook
                  key: database-url
            # Service photos in R2 (ZIF-133, docs/runbooks.md "R2 for Ziftbook photos"). EU buckets answer only on the .eu
            # endpoint. The env's own R2 token is in Secret ziftbook-storage; optional: uploads answer 503 until it exists.
            # ZIF_S3_UPLOADS_BUCKET is left out on purpose until ziftbook 0.31.0 (ZIF-214): photo uploads answer 503.
            - name: ZIF_S3_MEDIA_BUCKET
              value: ziftbook-media-staging
            - name: ZIF_MEDIA_URL
              value: https://img-dev.ziftbook.com
            - name: ZIF_S3_ENDPOINT
              value: https://fb5eb042529f2621c6de3f34c6801174.eu.r2.cloudflarestorage.com
            - name: ZIF_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: access-key-id
                  optional: true
            - name: ZIF_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: secret-access-key
                  optional: true
            # X-Forwarded-For is believed only from pods: the frontend sets it from cf-connecting-ip, and
            # networkpolicy.yaml admits only the frontend. Cluster CIDR, not the node's podCIDR, which changes
            # if the node re-registers. Node-local traffic (source 10.42.0.1) is owner-only (NetBird).
            - name: ZIF_TRUSTED_PROXIES
              value: 10.42.0.0/16
            # Turnstile widget `ziftbook-staging` (hostname dev.ziftbook.com, made by hand, ZIF-116). Without the secret the API
            # refuses every public booking and logs an ERROR at start (fail closed), so optional only spares the pod.
            - name: ZIF_TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ziftbook-turnstile
                  key: secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi # image decode at Save: 152 MB baseline plus up to 83 MB (ZIF-133)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
