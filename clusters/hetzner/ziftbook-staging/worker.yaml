# Ziftbook background worker on staging (INFRA-46): the backend image, polling Postgres for jobs.
# 90s grace lets in-flight jobs finish on SIGTERM (compose stop_grace_period). Mail goes out through the Mailgun
# HTTP API (INFRA-47 wiring, ZIF-151 code); the key is in its own Secret ziftbook-mailgun (api-key), so it can be
# written with the public SOPS key alone and rotated without touching the ziftbook Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ziftbook-staging
spec:
  replicas: 1
  # One worker at a time, and no surge over the quota.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      priorityClassName: staging
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/fjcloudaiconsulting/ziftbook/migrations:v0.29.0@sha256:a51890f1ea5cdfa8e5d621f74adaefa3a62d5b154da5f5fa69508ba179919b99
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            - name: ZIF_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook
                  key: migrate-database-url
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: worker
          image: ghcr.io/fjcloudaiconsulting/ziftbook/backend:v0.29.0@sha256:e1a110faa61fdc0bf7eef0130a72bab66cd8e3604711ad6f0888e36e4eb1381d
          command: [python, -m, app.worker]
          envFrom:
            - configMapRef:
                name: otel # otel.yaml
          env:
            - name: ZIF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook
                  key: database-url
            - name: ZIF_APP_URL # email links; the backend reads it too
              value: https://dev.ziftbook.com
            # Mailgun HTTP API like TBD: EU region, the shared dev sending domain m.fjconsulting.dev (own sending key per environment). ZIF-151 consumes these names;
            # until it ships no mail is delivered (v0.20.2 still tries SMTP and the job retries). Only the worker sends mail. optional: the worker keeps
            # running before the owner adds the key.
            - name: ZIF_MAILGUN_DOMAIN
              value: m.fjconsulting.dev
            - name: ZIF_MAILGUN_REGION
              value: eu
            - name: ZIF_MAILGUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-mailgun
                  key: api-key
                  optional: true
            # Stripe sandbox key for payment jobs (ZIF-158); optional like the backend's.
            - name: ZIF_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-stripe
                  key: secret-key
                  optional: true
            # Dead-man's switch (ZIF-21): the worker GETs this Healthchecks.io ping URL after each good loop (about 30 s), and
            # the check alerts when pings stop. Its own Secret like ziftbook-mailgun; optional, so the worker runs without it.
            - name: ZIF_HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  name: ziftbook-healthcheck
                  key: url
                  optional: true
            # Service photos in R2 (ZIF-133, docs/runbooks.md "R2 for Ziftbook photos"). EU buckets answer only on the .eu
            # endpoint. The env's own R2 token is in Secret ziftbook-storage; optional: uploads answer 503 until it exists.
            - name: ZIF_S3_UPLOADS_BUCKET
              value: ziftbook-uploads-staging
            - name: ZIF_S3_MEDIA_BUCKET
              value: ziftbook-media-staging
            - name: ZIF_MEDIA_URL
              value: https://img-dev.ziftbook.com
            - name: ZIF_S3_ENDPOINT
              value: https://fb5eb042529f2621c6de3f34c6801174.eu.r2.cloudflarestorage.com
            - name: ZIF_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: access-key-id
                  optional: true
            - name: ZIF_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-storage
                  key: secret-access-key
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
