# Ziftbook web (Next.js standalone) on staging (INFRA-46). It proxies /api/* to the backend and passes the visitor IP
# from cf-connecting-ip: every request arrives through the Cloudflare Tunnel (INFRA-173), which routes dev.ziftbook.com
# here (terraform/cloudflare/tunnel.tf); networkpolicy.yaml admits only the cloudflared pods.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ziftbook-staging
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ziftbook-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      priorityClassName: staging
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000 # node in the image
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/fjcloudaiconsulting/ziftbook/frontend:v0.31.0@sha256:6dac5f1c005bc741271e64c02a1ddace83e05cebe6601548abca7a0057e1310c
          ports:
            - containerPort: 3000
          env:
            - name: ZIF_API_URL
              value: http://backend:8000
            - name: ZIF_CLIENT_IP_HEADER
              value: cf-connecting-ip
            # Dev-only version line in the UI (ziftbook #312); prod leaves it unset.
            - name: ZIF_SHOW_VERSION
              value: "true"
            # Public, but kept beside the widget's secret so one owner step writes both (ZIF-116). Read per request.
            - name: ZIF_TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: ziftbook-turnstile
                  key: site-key
                  optional: true
            # Content-Security-Policy origins (ZB-12), read per request: images from the media domain (the backend's
            # ZIF_MEDIA_URL) and photo uploads to the R2 account endpoint the API presigns them for (docs/runbooks.md
            # "R2 for Ziftbook photos"). The web holds no R2 credential and uses the endpoint for the policy only.
            - name: ZIF_MEDIA_URL
              value: https://img-dev.ziftbook.com
            - name: ZIF_S3_ENDPOINT
              value: https://fb5eb042529f2621c6de3f34c6801174.eu.r2.cloudflarestorage.com
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          readinessProbe:
            tcpSocket:
              port: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
