# Ingress to ziftbook-staging is deny-by-default. The Cloudflare Tunnel (cloudflared namespace, INFRA-173; no Traefik on
# this cluster) reaches the frontend; only the frontend reaches the backend,
# which is what makes trusting X-Forwarded-For from the pod CIDR safe (backend.yaml). Egress is open except instance
# metadata and the node network (egress-no-imds). Node-local traffic bypasses these policies (see
# data/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ziftbook-staging
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: ziftbook-staging
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: ziftbook-staging
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8000
---
# Egress is open except the instance metadata endpoint: staging images automerge, and nothing here needs IMDS.
# Pods are listed separately because ipBlock is meant for addresses outside the cluster.
# The node network (hcloud_network.main in terraform/hetzner) is excepted too: no pod here talks to a node (no API
# token, no hostNetwork peer). Pods, and Services once DNATed to their pod addresses, match the namespace peer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-no-imds
  namespace: ziftbook-staging
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32, 10.0.0.0/16]
