apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd.yaml
  - system-upgrade-controller.yaml
  - plans.yaml
# Upstream's kubectl image is v1.30.3, outside the +-1 minor skew of a v1.36 server, and the app Plan's drain does real
# work with it (INFRA-179). Patched here, not in system-upgrade-controller.yaml, so a re-download of the release asset
# diffs cleanly. The drain runs with the controller's ServiceAccount, so the image is pinned by digest too (multi-arch
# index of the tag, K8S-02). Bump tag and digest together by hand with every k3s minor: no Renovate manager sees this
# line.
patches:
  - target:
      kind: ConfigMap
      name: default-controller-env
    patch: |
      - op: replace
        path: /data/SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE
        value: rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
  # The upgrade Jobs must stay privileged with the host mounted, so enforce stays privileged; warn and audit at baseline
  # report each such pod, and anything else that lands here (K8S-09).
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: system-upgrade
        labels:
          pod-security.kubernetes.io/warn: baseline
          pod-security.kubernetes.io/audit: baseline
  # The controller pod itself (K8S-08); upstream sets no resources and leaves the root writable. Its image is the static
  # binary on scratch, run as 65534 with no capabilities, so the emptyDir upstream mounts at /tmp is all it can write:
  # a read-only root takes nothing away (re-check on a re-vendor). Memory: a Go controller caching this namespace's
  # Plans, Jobs and Secrets plus three Nodes, tens of MiB; 128Mi leaves several times that, and an OOM kill fires
  # NodeOOMKill. Check after a change: max_over_time(container_memory_working_set_bytes{namespace="system-upgrade",
  # container="system-upgrade-controller"}[7d]). Only this Deployment matches: the upgrade Jobs take their pod spec
  # from the Plans and default-controller-env, never from the controller's own pod.
  - target:
      kind: Deployment
      name: system-upgrade-controller
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
      spec:
        template:
          spec:
            containers:
              - name: system-upgrade-controller
                securityContext:
                  readOnlyRootFilesystem: true
                resources:
                  requests:
                    memory: 32Mi
                  limits:
                    memory: 128Mi
# The controller runs cluster-wide with a privileged ServiceAccount: pin the image by digest (multi-arch index of
# v0.20.2) without touching the vendored file. Bumped by hand with a re-vendor of crd.yaml (runbook "Upgrade k3s").
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.20.2
    digest: sha256:61b68d4372baf7ae90fb0f879feea1c082381a8b7547cc5ec85d393c497b11cb
