# k3s upgrades (INFRA-179, runbook "Upgrade k3s"). Both Plans share the version; Renovate bumps it together with
# k3s_version in ansible/group_vars/all.yml. `upgrade.image` has no tag on purpose: the controller appends the version.
# One server at a time, app nodes first, db-1 last (its prepare waits for the app Plan).
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-app
  namespace: system-upgrade
spec:
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.36.5+k3s1
  serviceAccountName: system-upgrade
  concurrency: 1
  postCompleteDelay: 2m
  # Default 900 s is shorter than prepare (10m) + drain (10m) + upgrade.
  jobActiveDeadlineSecs: 1800
  nodeSelector:
    matchExpressions:
      - key: role
        operator: In
        values: [app]
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  # Prod keeps one of two replicas through each app node (INFRA-177 PDBs). timeout is a STRING: an integer is read as
  # nanoseconds in v0.20.2 and every drain would time out at once.
  drain:
    ignoreDaemonSets: true
    deleteEmptydirData: true
    timeout: "10m"
  prepare:
    image: rancher/k3s-upgrade
    command: [sh, -c]
    args:
      - |
        set -eu
        # Quorum guard. The sleep lets a flapping k3s show up in the Ready check.
        sleep 60
        /opt/k3s kubectl wait node --all --for=condition=Ready --timeout=10m
        # Fail (the job retries) while any other node is cordoned. This node is skipped: a retry pod finds it cordoned
        # by the previous attempt. The check stays because it also catches the db gate's stale-status race.
        nodes=$(/opt/k3s kubectl get nodes -o jsonpath='{range .items[?(@.spec.unschedulable==true)]}{.metadata.name}{"\n"}{end}')
        cordoned=$(printf '%s\n' "$nodes" | grep -vxF "$SYSTEM_UPGRADE_NODE_NAME" || true)
        if [ -n "$cordoned" ]; then
          echo "another node is cordoned: $cordoned" >&2
          exit 1
        fi
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-db
  namespace: system-upgrade
spec:
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.36.5+k3s1
  serviceAccountName: system-upgrade
  concurrency: 1
  postCompleteDelay: 2m
  # No deadline: prepare waits for the whole app roll.
  jobActiveDeadlineSecs: 0
  nodeSelector:
    matchExpressions:
      - key: role
        operator: In
        values: [db]
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  tolerations:
    - key: role
      operator: Equal
      value: db
      effect: NoSchedule
  # Cordon only: the local-path PVs are pinned to db-1, so a drain would be a full database outage. k3s runs with
  # KillMode=process, so the containers survive the k3s restart.
  cordon: true
  prepare:
    image: rancher/k3s-upgrade
    command: [sh, -c]
    args:
      - |
        set -eu
        # Gate: db-1 goes last. Wait until Plan k3s-app has finished this version on every app node. latestVersion
        # guards against a status not yet rewritten after a merge; the node label is set by the controller after the
        # job completes and postCompleteDelay. Each label line is prefixed with x so an unlabeled node is not an empty line
        # that $(...) would strip.
        while :; do
          hash=$(/opt/k3s kubectl -n system-upgrade get plan k3s-app -o jsonpath='{.status.latestHash}')
          ver=$(/opt/k3s kubectl -n system-upgrade get plan k3s-app -o jsonpath='{.status.latestVersion}')
          applying=$(/opt/k3s kubectl -n system-upgrade get plan k3s-app -o jsonpath='{.status.applying}')
          labels=$(/opt/k3s kubectl get nodes -l role=app -o jsonpath='{range .items[*]}x{.metadata.labels.plan\.upgrade\.cattle\.io/k3s-app}{"\n"}{end}')
          if [ -n "$hash" ] && [ "$ver" = "$SYSTEM_UPGRADE_PLAN_LATEST_VERSION" ] && [ -z "$applying" ] &&
            [ -n "$labels" ] && [ "$(printf '%s\n' "$labels" | grep -vxcF "x$hash")" = 0 ]; then
            break
          fi
          echo "waiting for Plan k3s-app: version=$ver applying=$applying" >&2
          sleep 30
        done
        # Quorum guard, as in k3s-app. The sleep lets a flapping k3s show up in the Ready check.
        sleep 60
        /opt/k3s kubectl wait node --all --for=condition=Ready --timeout=10m
        # This node is skipped: a retry pod finds it cordoned by the previous attempt. The check stays because it
        # also catches the stale-status race above.
        nodes=$(/opt/k3s kubectl get nodes -o jsonpath='{range .items[?(@.spec.unschedulable==true)]}{.metadata.name}{"\n"}{end}')
        cordoned=$(printf '%s\n' "$nodes" | grep -vxF "$SYSTEM_UPGRADE_NODE_NAME" || true)
        if [ -n "$cordoned" ]; then
          echo "another node is cordoned: $cordoned" >&2
          exit 1
        fi
  upgrade:
    image: rancher/k3s-upgrade
