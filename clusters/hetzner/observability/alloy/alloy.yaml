# Grafana Alloy: the one collector (INFRA-85, docs/architecture.md, Telemetry). A DaemonSet on every node, db-1 included
# (it tolerates role=db), so a rollout never runs two copies on a node and each node's metrics carry instance=<node>. Apps send OTLP/HTTP to alloy.observability.svc:4318; Alloy scrapes the node and the kubelet
# itself, and reads Ziftbook pod logs through the kube API (ZIF-89); everything goes to Grafana Cloud with the credentials
# in Secret grafana-cloud. Config: config.alloy.
# Debug UI: kubectl -n observability port-forward ds/alloy 12345, then http://localhost:12345.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
---
# The kubelet's /metrics/cadvisor (nodes/metrics) only. Not nodes/proxy, which reaches every kubelet API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
---
# Pod logs (ZIF-89). Bound only by the RoleBindings below, so it grants nothing outside the two Ziftbook namespaces:
# Alloy cannot read logs in data or tbd-*.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-pod-logs
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-logs
  namespace: ziftbook-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-logs
  namespace: ziftbook-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: observability
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      tolerations:
        - key: role
          operator: Equal
          value: db
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        # Its own uid, not nobody (65534): Alloy sees every host process through /host/proc, and a process's environ is
        # readable by the same uid.
        runAsUser: 473
        runAsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.3-distroless@sha256:12ff3a82e402d34b450e7cb0555ff9703da645068dc321b2a98b9f1c110ab9e2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            # The UI and /metrics (no auth) listen on the pod IP for the readiness probe; the NetworkPolicy below admits
            # only 4318. Node-local traffic (hostNetwork pods such as netbird) bypasses it; the NetBird ACL admits the
            # owner to TCP 6443 only.
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
          env:
            # The Go runtime collects harder near this, well before the container limit.
            - name: GOMEMLIMIT
              value: 200MiB
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GRAFANA_CLOUD_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: otlp-endpoint
            - name: GRAFANA_CLOUD_INSTANCE_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: instance-id
            - name: GRAFANA_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: token
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Measured 52 to 100 MiB working set before any app traffic (docs/runbooks.md, Metrics to Grafana Cloud).
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            # The parent, not .../data: the image's /var/lib/alloy is root-only, so a non-root uid could not reach data.
            - name: data
              mountPath: /var/lib/alloy
            # Node metrics only. Recursive read-only: plain readOnly leaves submounts writable. The host's / is not
            # mounted (disk space comes from cAdvisor), so no host files, PV data included, are visible.
            - name: proc
              mountPath: /host/proc
              readOnly: true
              recursiveReadOnly: Enabled
            - name: sys
              mountPath: /host/sys
              readOnly: true
              recursiveReadOnly: Enabled
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability
spec:
  selector:
    app: alloy
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
# Only the app namespaces reach the OTLP port; never `data`. Node-local traffic bypasses this (see
# data/networkpolicy.yaml). Egress (Grafana Cloud, the kubelet, DNS) is open except instance metadata.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tbd-prod
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tbd-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ziftbook-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ziftbook-prod
        # The log-retention DaemonSet's heartbeat (INFRA-130).
        - podSelector:
            matchLabels:
              app: log-retention
      ports:
        - port: 4318
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
