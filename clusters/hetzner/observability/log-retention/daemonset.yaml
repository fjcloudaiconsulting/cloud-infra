# Request-log retention (INFRA-130): deletes container log content older than 6 days from every node, hourly, so the
# privacy policy's "up to 7 days" holds. A DaemonSet: logs live on
# each node's own /var/log/pods, so each node needs its own pass, db-1 included (it tolerates role=db). Script and rules:
# log-retention.sh; the heartbeat carries the node name, so Grafana sees a stale node even while the others report.
# Root, because the log files are root-owned; no capabilities needed (owner access). Only /var/log/pods is mounted.
# kubelet's own size rotation (10Mi x 5 files) stays as it is.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-retention
  namespace: observability
spec:
  selector:
    matchLabels:
      app: log-retention
  template:
    metadata:
      labels:
        app: log-retention
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: role
          operator: Equal
          value: db
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: log-retention
          image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          # One pass an hour, the first at pod start. A failed or hung pass (600 s cap, the CronJob's deadline) only skips
          # its heartbeat, which LogRetentionStale reports; the loop goes on.
          command:
            - sh
            - -c
            - 'while true; do timeout 600 sh /script/log-retention.sh || echo "log-retention: pass failed" >&2; sleep 3600; done'
          env:
            - name: HEARTBEAT_URL
              value: http://alloy.observability.svc:4318/v1/metrics
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TMPDIR
              value: /work
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: work
              mountPath: /work
            - name: pods
              mountPath: /var/log/pods
      volumes:
        - name: script
          configMap:
            name: log-retention
        - name: work
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
            type: Directory
