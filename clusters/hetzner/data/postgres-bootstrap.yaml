# Ziftbook roles and database grants (backend/migrations/bootstrap.sql, idempotent), fetched from a
# pinned commit of the public repo and checked against its sha256. To pick up a new version or a
# rotated password, bump the commit and sha256 (or delete the Job): Flux recreates it.
# A rotated ziftbook password must also go into ziftbook-staging/ziftbook.secret.yaml (the app's
# connection URLs), or staging loses the database, and nothing else: production logs in as its own roles
# (postgres-bootstrap-prod.yaml). The ziftbook database is staging's; production is ziftbook_prod.
# The worker's role ziftbook_worker (ZB-08: ziftbook_app's privileges plus what only background jobs may do)
# is shared like the other two, so both Jobs set its password from the same Secret, postgres-ziftbook-worker;
# the same value is in ziftbook-staging/ziftbook-worker-database.secret.yaml (staging's worker URL). Rotate the
# two together (docs/runbooks.md "Ziftbook production secrets").
# admin-password is read only at initdb: rotate it with ALTER ROLE postgres PASSWORD first.
# bootstrap.sql runs in one transaction that ends with the same end-state check as postgres-bootstrap-prod.yaml (no
# login of one environment can open the other's database): a run that fails it, or stops anywhere, changes nothing.
# A Failed Job does not make the Flux Kustomization unready: check `kubectl -n data get job` after a change.
apiVersion: batch/v1
kind: Job
metadata:
  name: ziftbook-bootstrap
  namespace: data
  annotations:
    # The pod template is immutable: on a change, Flux deletes and recreates the Job instead of failing.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  # No ttlSecondsAfterFinished: Flux would recreate a deleted Job and rerun it every interval.
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 999 # postgres in its image; curl's image names its user, which runAsNonRoot cannot check
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: curlimages/curl:8.23.0@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
          env:
            - name: URL
              value: https://raw.githubusercontent.com/fjcloudaiconsulting/ziftbook/afcc222885e6df46e7dbc830d9a3b2fbbf72b504/backend/migrations/bootstrap.sql
            - name: SHA256
              value: ad12d2174033a5677c315e1f838ddf910517a4c7e992a0ff81d10c7d9300a9dc
          command: [sh, -c, 'curl -fsSLo /work/bootstrap.sql "$URL" && echo "$SHA256  /work/bootstrap.sql" | sha256sum -c -']
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: psql
          image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
          # The server may still be starting (first boot runs initdb).
          command:
            - sh
            - -c
            - |
              # Stop at the first failure: a failed step fails the Job.
              set -e
              until pg_isready -q; do sleep 2; done
              exec psql -v ON_ERROR_STOP=1 <<'SQL'
              \set ON_ERROR_STOP on
              BEGIN;
              \i /work/bootstrap.sql

              -- The end state, checked before COMMIT; the same block ends both Jobs. No staging login can open
              -- ziftbook_prod and no production login can open ziftbook, through any grant or membership: otherwise the
              -- Job fails and the run changes nothing. A role or database not created yet is skipped. A named dollar
              -- quote: Kubernetes turns a double dollar sign in a command into a single one.
              DO $check$
              DECLARE
                crossed text;
              BEGIN
                SELECT string_agg(c.rol || ' on ' || c.db, ', ') INTO crossed
                FROM (VALUES ('ziftbook_app', 'ziftbook_prod'), ('ziftbook_migrate', 'ziftbook_prod'),
                             ('ziftbook_worker', 'ziftbook_prod'), ('ziftbook_prod_app', 'ziftbook'),
                             ('ziftbook_prod_migrate', 'ziftbook'), ('ziftbook_prod_worker', 'ziftbook')) AS c (rol, db)
                JOIN pg_roles r ON r.rolname = c.rol
                JOIN pg_database d ON d.datname = c.db
                WHERE has_database_privilege(r.oid, d.oid, 'CONNECT');
                IF crossed IS NOT NULL THEN
                  RAISE EXCEPTION 'CONNECT crosses environments: %', crossed;
                END IF;
              END
              $check$;
              COMMIT;
              SQL
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: ziftbook
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: admin-password
            - name: ZIF_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: ziftbook-migrate-password
            - name: ZIF_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: ziftbook-app-password
            - name: ZIF_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ziftbook-worker
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
