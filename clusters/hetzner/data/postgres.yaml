# Postgres 18 for Ziftbook. Admin and role passwords: postgres.secret.yaml.
# Both files are read at start (subPath mounts): a change applies at the next Postgres restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  namespace: data
data:
  # The superuser logs in over the pod's socket or loopback only; every network login is a named role with a password.
  # Addresses only, never a hostname: the server looks up no names and has no egress (networkpolicy.yaml).
  pg_hba.conf: |
    local all      all                     trust
    host  all      postgres 127.0.0.1/32   scram-sha-256
    host  all      postgres ::1/128        scram-sha-256
    host  all      postgres all            reject
    host  all      all      all            scram-sha-256
  # First start only: the image runs it on an empty volume, as the superuser over the socket, in database ziftbook.
  # What only the superuser may do; the bootstrap Jobs, logged in as the admin, do the rest and check all of it. One
  # transaction: a failed run leaves no login, the Jobs cannot log in, and the fix is a new empty volume.
  # The admin creates the app roles and so gets ADMIN on them; it gets no ADMIN on the backup logins.
  10-logins.sql: |
    \set ON_ERROR_STOP on
    \getenv admin_password ZIF_ADMIN_PASSWORD
    \getenv backup_password ZIF_BACKUP_PASSWORD
    \getenv prod_backup_password ZIF_PROD_BACKUP_PASSWORD
    -- Stop if a password is unset or empty; the message never holds a value.
    \set admin_password_missing true
    \if :{?admin_password}
    SELECT :'admin_password' = '' AS admin_password_missing \gset
    \endif
    \if :admin_password_missing
    DO $msg$ BEGIN RAISE EXCEPTION 'ZIF_ADMIN_PASSWORD is unset or empty'; END $msg$;
    \endif
    \set backup_password_missing true
    \if :{?backup_password}
    SELECT :'backup_password' = '' AS backup_password_missing \gset
    \endif
    \if :backup_password_missing
    DO $msg$ BEGIN RAISE EXCEPTION 'ZIF_BACKUP_PASSWORD is unset or empty'; END $msg$;
    \endif
    \set prod_backup_password_missing true
    \if :{?prod_backup_password}
    SELECT :'prod_backup_password' = '' AS prod_backup_password_missing \gset
    \endif
    \if :prod_backup_password_missing
    DO $msg$ BEGIN RAISE EXCEPTION 'ZIF_PROD_BACKUP_PASSWORD is unset or empty'; END $msg$;
    \endif
    BEGIN;
    CREATE ROLE ziftbook_admin WITH LOGIN NOSUPERUSER CREATEROLE CREATEDB NOBYPASSRLS NOINHERIT CONNECTION LIMIT 1
      PASSWORD :'admin_password';
    ALTER DATABASE ziftbook OWNER TO ziftbook_admin;
    GRANT pg_use_reserved_connections TO ziftbook_admin WITH ADMIN TRUE, INHERIT FALSE, SET FALSE;
    -- One backup login per database: every row (BYPASSRLS: the tables force row security), nothing else. Each Job
    -- grants its own CONNECT.
    CREATE ROLE ziftbook_backup WITH LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB BYPASSRLS CONNECTION LIMIT 1
      PASSWORD :'backup_password';
    CREATE ROLE ziftbook_prod_backup WITH LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB BYPASSRLS CONNECTION LIMIT 1
      PASSWORD :'prod_backup_password';
    GRANT pg_read_all_data TO ziftbook_backup, ziftbook_prod_backup;
    REVOKE CONNECT ON DATABASE postgres, template1 FROM PUBLIC;
    COMMIT;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # db-1 only: its local-path storage is the Hetzner volume (ansible db_storage). The PV pins the pod there anyway.
      nodeSelector:
        role: db
      tolerations:
        - key: role
          operator: Equal
          value: db
          effect: NoSchedule
      securityContext:
        runAsUser: 999 # postgres in the image
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # The image's STOPSIGNAL SIGINT is a fast shutdown; give checkpointing time before the kill.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
          # Sized for a 384Mi limit; Ziftbook pools, per environment (staging and production, INFRA-82): backend 5+10, worker 21,
          # plus migrate and admin; 103 connections cover both environments at full pool, with the admin and backups.
          # Ceiling: ~40 busy sessions at work_mem each; no parallel workers, which would multiply it.
          # Connection budget (tests/test_postgres_isolation.py): 3 slots for superusers (the default); staging's logins
          # capped at 40 in its bootstrap Job; production's full pools 57 (2 API pods x 16, worker 21, 3 migrate init
          # containers, admin CLI); the admin login and the two backup logins, capped at 1 each. 3 + 40 + 57 + 3 = 103:
          # production always fits beside a staging at its caps.
          # reserved_connections keeps 26 slots for logins granted pg_use_reserved_connections (production's, in its Job)
          # and the superuser, should a cap be missing. Postgres refuses every other login once fewer than 26 + 3 slots are
          # free, whoever holds the rest, so 26 never refuses staging below its caps (with its backup and the admin) beside
          # production's standing pools (2 x 5 + 21) and backup: 103 - 3 - 42 - 32 = 26. It is also production's growth
          # from standing to full pools.
          # authentication_timeout: a connection holds a slot from its startup packet until it authenticates, before any
          # cap applies; the apps authenticate in milliseconds. The keepalives end, within 2 minutes, the sessions of a pod
          # lost with its node, which would otherwise count against a cap for over 2 hours (the kernel's default).
          args:
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            - -c
            - shared_buffers=64MB
            - -c
            - effective_cache_size=192MB
            - -c
            - work_mem=2MB
            - -c
            - maintenance_work_mem=32MB
            - -c
            - max_connections=103
            - -c
            - reserved_connections=26
            - -c
            - authentication_timeout=10s
            - -c
            - tcp_keepalives_idle=60
            - -c
            - tcp_keepalives_interval=10
            - -c
            - tcp_keepalives_count=6
            - -c
            - max_parallel_workers_per_gather=0
          env:
            - name: POSTGRES_DB
              value: ziftbook
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: admin-password
            # Read by 10-logins.sql at first start only. Rotation: docs/runbooks.md "Postgres admin and backup logins".
            - name: ZIF_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ziftbook-admin
                  key: password
            - name: ZIF_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ziftbook-backup
                  key: password
            - name: ZIF_PROD_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ziftbook-prod-backup
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          # TCP, not the socket: initdb's temporary server listens on the socket only.
          startupProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1]
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1]
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker, not .../data.
            - name: data
              mountPath: /var/lib/postgresql
            - name: config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
            - name: config
              mountPath: /docker-entrypoint-initdb.d/10-logins.sql
              subPath: 10-logins.sql
      volumes:
        - name: config
          configMap:
            name: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
