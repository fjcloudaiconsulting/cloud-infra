# Postgres 18 for Ziftbook. Admin and role passwords: postgres.secret.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # db-1 only: its local-path storage is the Hetzner volume (ansible db_storage). The PV pins the pod there anyway.
      nodeSelector:
        role: db
      tolerations:
        - key: role
          operator: Equal
          value: db
          effect: NoSchedule
      securityContext:
        runAsUser: 999 # postgres in the image
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # The image's STOPSIGNAL SIGINT is a fast shutdown; give checkpointing time before the kill.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
          # Sized for a 384Mi limit; Ziftbook pools, per environment (staging and production, INFRA-82): backend 5+10, worker 21,
          # plus migrate and admin; 100 connections cover both environments at full pool.
          # Ceiling: ~40 busy sessions at work_mem each; no parallel workers, which would multiply it.
          # Connection budget (tests/test_postgres_isolation.py): 3 slots for superusers (the default); staging's logins
          # capped at 40 in its bootstrap Job; production's full pools 57 (2 API pods x 16, worker 21, 3 migrate init
          # containers, admin CLI). 3 + 40 + 57 = 100: production always fits beside a staging at its caps.
          # reserved_connections keeps 26 slots for logins granted pg_use_reserved_connections (production's, in its Job)
          # and the admin, should a cap be missing. Postgres refuses every other login once fewer than 26 + 3 slots are
          # free, whoever holds the rest, so 26 is the most that never refuses staging below its caps beside production's
          # standing pools (2 x 5 + 21): 100 - 3 - 40 - 31. It is also production's growth from standing to full pools.
          # authentication_timeout: a connection holds a slot from its startup packet until it authenticates, before any
          # cap applies; the apps authenticate in milliseconds. The keepalives end, within 2 minutes, the sessions of a pod
          # lost with its node, which would otherwise count against a cap for over 2 hours (the kernel's default).
          args:
            - -c
            - shared_buffers=64MB
            - -c
            - effective_cache_size=192MB
            - -c
            - work_mem=2MB
            - -c
            - maintenance_work_mem=32MB
            - -c
            - max_connections=100
            - -c
            - reserved_connections=26
            - -c
            - authentication_timeout=10s
            - -c
            - tcp_keepalives_idle=60
            - -c
            - tcp_keepalives_interval=10
            - -c
            - tcp_keepalives_count=6
            - -c
            - max_parallel_workers_per_gather=0
          env:
            - name: POSTGRES_DB
              value: ziftbook
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: admin-password
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          # TCP, not the socket: initdb's temporary server listens on the socket only.
          startupProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1]
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1]
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker, not .../data.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
