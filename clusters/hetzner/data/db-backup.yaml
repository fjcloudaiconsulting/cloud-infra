# Nightly dumps of TBD MySQL (production and, since INFRA-67, staging) and Ziftbook Postgres (staging and, since INFRA-82,
# production) to the Object Lock bucket (terraform/tbd-backups). Every set is dumped here.
# Each dump init container exits 0 and writes <set>.ok (its upload list) only when its dump verifies;
# upload sends each verified set dump, grants, manifest (manifest last, so the probe sees only complete
# nights) and fails the Job if a set is missing. Run now: kubectl -n data create job --from=cronjob/db-backup db-backup-manual
# DUMP_SETS lists every set: tbd-mysql, tbd-staging-mysql, ziftbook-postgres and ziftbook-prod-postgres.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-backup
  namespace: data
data:
  # Set format: <prefix>/YYYY/MM/DD/{<db>,grants,manifest}_<stamp>.
  common.sh: |
    set -euo pipefail
    STAMP=$(date -u +%Y%m%d-%H%M%S)
    DIR="$SET/${STAMP:0:4}/${STAMP:4:2}/${STAMP:6:2}"
    DUMP="$DIR/${DB}_${STAMP}.sql.gz" GRANTS="$DIR/grants_${STAMP}.sql.gz" MANIFEST="$DIR/manifest_${STAMP}.json"
    cd /backup && mkdir -p "$DIR"
    MIN_TABLES=${MIN_TABLES:-1}
    die() { echo "!! $SET: $*" >&2; exit 1; }
    # Read to EOF, never grep -q: under pipefail a SIGPIPEd gzip fails a good file. A custom-format
    # Postgres archive (*.dump) reads as the SQL pg_restore would send, so it is checked the same way.
    text() { case $1 in *.dump) pg_restore -f - "$1" ;; *) gzip -dc "$1" ;; esac; }
    count() { text "$1" | grep -Ec "$2" || true; }
    # Called last: verify, checksum, manifest, then the ordered upload list that marks the set as good.
    publish() {
      [ "$TABLES" -ge "$MIN_TABLES" ] || die "$TABLES tables, expected at least $MIN_TABLES"
      text "$DUMP" >/dev/null && gzip -t "$GRANTS" || die "dump or grants unreadable"
      [ "$(count "$DUMP" "$MARKER")" -eq 1 ] || die "dump has no completion marker"
      [ "$(count "$DUMP" "$TABLE_RE")" -eq "$TABLES" ] || die "table count differs from $TABLES"
      art() { printf '{"key": "%s", "bytes": %s, "sha256": "%s"}' "$1" "$(wc -c <"$1")" "$(sha256sum "$1" | cut -d' ' -f1)"; }
      printf '{\n  "date": "%s",\n  "host": "%s",\n  "database": "%s",\n  "tables": %s,\n  "%s": "%s",\n  "dump": %s,\n  "grants": %s\n}\n' \
        "$STAMP" "$HOSTNAME" "$DB" "$TABLES" "$VERSION_KEY" "$VERSION" "$(art "$DUMP")" "$(art "$GRANTS")" >"$MANIFEST"
      printf '%s\n' "$DUMP" "$GRANTS" "$MANIFEST" >"$SET.ok.tmp" && mv "$SET.ok.tmp" "$SET.ok"
      echo "ok: $SET $TABLES tables, $(wc -c <"$DUMP") bytes"
    }
  mysql-dump.sh: |
    # One set per database; the container's env names it (default: TBD production).
    SET=${SET:-tbd-mysql} DB=${DB:-tbd} APP_USER=${APP_USER:-tbd_app}
    VERSION_KEY=mysql_version MARKER='^-- Dump completed on ' TABLE_RE='^CREATE TABLE '
    . /scripts/common.sh
    q() { mysql -h mysql -u tbd_backup -N -B -e "$1"; }
    # A new pod is refused for about a second until the NetworkPolicy admits it (INFRA-175): the first container hit it.
    for _ in $(seq 30); do mysqladmin -h mysql -u tbd_backup --connect-timeout=2 ping >/dev/null 2>&1 && break; sleep 1; done
    TABLES=$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$DB' AND table_type='BASE TABLE'")
    VERSION=$(q "SELECT VERSION()")
    mysqldump -h mysql -u tbd_backup --single-transaction --routines --triggers --events --quick --hex-blob "$DB" | gzip >"$DUMP"
    # SHOW CREATE USER carries the password hash, so a restore yields working logins. Hex keeps the
    # binary hash intact; IF NOT EXISTS lets it replay over a fresh server's root.
    {
      echo "-- Users and grants for $DB, generated $STAMP. Restore BEFORE the data dump."
      q "SELECT CONCAT(QUOTE(user),'@',QUOTE(host)) FROM mysql.user WHERE user NOT IN ('mysql.sys','mysql.session','mysql.infoschema')" |
        while read -r acct; do
          q "SET SESSION print_identified_with_as_hex=ON; SHOW CREATE USER $acct" | sed 's/^CREATE USER /CREATE USER IF NOT EXISTS /; s/$/;/'
          q "SHOW GRANTS FOR $acct" | sed 's/$/;/'
        done
    } | gzip >"$GRANTS"
    [ "$(count "$GRANTS" '^CREATE USER IF NOT EXISTS `'"$APP_USER"'`@')" -ge 1 ] || die "grants lack $APP_USER"
    publish
  pg-dump.sh: |
    # One set per database; the container's env names it (default: Ziftbook staging).
    SET=${SET:-ziftbook-postgres} DB=${DB:-ziftbook} VERSION_KEY=postgres_version
    MARKER='^-- PostgreSQL database dump complete' TABLE_RE='^CREATE (UNLOGGED )?TABLE '
    . /scripts/common.sh
    # Custom format (INFRA-235): RESTORE.md restores it with pg_restore as the database's owner role, never
    # through psql as a superuser. The roles, the database and its grants come from the bootstrap Jobs.
    DUMP=${DUMP%.sql.gz}.dump
    q() { psql -d "$DB" -XAtc "$1"; }
    # Extension-owned tables are recreated by CREATE EXTENSION, not dumped.
    TABLES=$(q "SELECT count(*) FROM pg_tables t WHERE schemaname NOT IN ('pg_catalog','information_schema') AND NOT EXISTS
      (SELECT 1 FROM pg_depend d WHERE d.classid = 'pg_class'::regclass AND d.deptype = 'e'
        AND d.objid = format('%I.%I', t.schemaname, t.tablename)::regclass)")
    VERSION=$(q "SHOW server_version")
    # Globals: the night's record of the roles (and their hashes); the custom-format restore does not replay them.
    pg_dump -Fc -f "$DUMP" "$DB"
    pg_dumpall --globals-only | gzip >"$GRANTS"
    [ "$(count "$GRANTS" '^-- PostgreSQL database cluster dump complete')" -eq 1 ] || die "globals have no completion marker"
    publish
  # One PUT per object: multipart needs kms:Decrypt (denied). The uploader's policy requires both SSE
  # headers. CLI 2.37 sends a CRC64NVME checksum by default; SHA256 is what the manifests record.
  # With R2_ENDPOINT set (INFRA-203) it uploads to R2 instead: the dump and grants are gpg-encrypted to the owner's
  # backup key first (<key>.gpg), so the uploader cannot read them back; the manifest stays plaintext for the probe.
  upload.sh: |
    set -uo pipefail
    rc=0
    if [ -n "${R2_ENDPOINT:-}" ]; then
      # Never upload a plaintext dump: no key, no upload.
      [ -s /scripts/backups.pub.asc ] || { echo "!! no backup encryption key in /scripts/backups.pub.asc" >&2; exit 1; }
      dest=(--endpoint-url "$R2_ENDPOINT")
    else
      dest=(--server-side-encryption aws:kms --ssekms-key-id "$KMS_KEY_ARN")
    fi
    # The sets this cluster hosts (env DUMP_SETS, space-separated); empty must fail, not upload nothing.
    read -ra sets <<<"${DUMP_SETS:-}"
    [ "${#sets[@]}" -gt 0 ] || { echo "!! DUMP_SETS is empty or unset: no sets to upload" >&2; exit 1; }
    for set in "${sets[@]}"; do
      keys=()
      [ -f "/backup/$set.ok" ] && mapfile -t keys <"/backup/$set.ok"
      # Exactly dump, grants, manifest, manifest last; anything else counts as missing.
      if [ "${#keys[@]}" -ne 3 ] || [[ "${keys[2]##*/}" != manifest_* ]]; then
        echo "!! $set: no verified dump" >&2; rc=1; continue
      fi
      for key in "${keys[@]}"; do
        body=/backup/$key
        if [ -n "${R2_ENDPOINT:-}" ] && [[ "${key##*/}" != manifest_* ]]; then
          # Under r2/: the set directories belong to the dump containers' user, and /backup itself is world-writable.
          body=/backup/r2/$key.gpg
          # A --recipient-file key needs no trust setting (the image's gnupg2-minimal has no --trust-model).
          mkdir -p "${body%/*}" && gpg --batch --no-tty --recipient-file /scripts/backups.pub.asc \
            --output "$body" --encrypt "/backup/$key" || { echo "!! $set: encrypt $key failed" >&2; rc=1; break; }
          key=$key.gpg
        fi
        aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$body" "${dest[@]}" \
          --checksum-algorithm SHA256 --no-cli-pager >/dev/null || { echo "!! $set: put $key failed" >&2; rc=1; break; }
        echo "uploaded $key"
      done
    done
    exit $rc
  # The owner's backup key, public half (INFRA-203): FJC database backups <flamarion@fjconsulting.io>, fingerprint
  # 037EF649967C4D1DA4982B8BA38C8AAA409FDED8, encryption subkey 7E6481DB5AC4A488A3F05424DF3FF6DD2C98FB6F. The private half
  # is offline (docs/runbooks.md "Backups to R2"); upload-r2 encrypts every dump and grants file to it.
  backups.pub.asc: |
    -----BEGIN PGP PUBLIC KEY BLOCK-----
    Comment: GPGTools - https://gpgtools.org

    mDMEau7TkBYJKwYBBAHaRw8BAQdAkvyGwvaRasT2d63q5s3MZzVJv5DUoFJ64JOS
    kV5l21W0MEZKQyBkYXRhYmFzZSBiYWNrdXBzIDxmbGFtYXJpb25AZmpjb25zdWx0
    aW5nLmlvPoiQBBMWCgA4FiEEA372SZZ8TR2kmCuLo4yKqkCf3tgFAmru05ACGwMF
    CwkIBwMFFQoJCAsFFgIDAQACHgECF4AACgkQo4yKqkCf3timuQEAyFnwJRvxqpzl
    HC5OYcTpe9vjUirkTUNl1wE/WVmoX3EBAMzyd32pMHspTqF0hO1SKUY9nfUpFThJ
    24aHj8ZcluQEuDgEau7TkBIKKwYBBAGXVQEFAQEHQDXg84fxEDyfe1ipW7YGJwNF
    XO4J265SJMlCHrGVhbdVAwEIB4h4BBgWCgAgFiEEA372SZZ8TR2kmCuLo4yKqkCf
    3tgFAmru05ACGwwACgkQo4yKqkCf3th1XgD7Bx0Aaf9NnSkaxOxo/bYF2B16U11T
    QUH+E4wtN6VonaoA/jSOp2DEvjX4HtMsMaaBX7Ur4O7wijC5QgH0/iC7o8oJ
    =iHwQ
    -----END PGP PUBLIC KEY BLOCK-----
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: data
spec:
  suspend: false
  # Probe reads at 04:17 UTC.
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Reruns the whole pod, so a healthy set can upload twice (~600 KB each, 7 days under Object Lock; accepted).
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: db-backup # admitted by the mysql and postgres NetworkPolicies
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # Dump containers never fail the pod, so upload always runs and decides the Job's outcome.
          initContainers:
            - name: mysql-dump
              image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
              command: [bash, -c, 'bash /scripts/mysql-dump.sh || echo "!! mysql dump failed" >&2; exit 0']
              env:
                # TBD production data (here since INFRA-175): an empty dump fails the set.
                - name: MIN_TABLES
                  value: "1"
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mysql
                      key: backup-password
              securityContext:
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
            # TBD staging (INFRA-67): same script, its own set. Runs after the production dump and never fails the
            # pod, so a broken staging database costs only its own set (and the Job's status that night).
            - name: mysql-dump-staging
              image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
              # timeout: a hung staging dump must not run out the Job's deadline before production uploads.
              command: [bash, -c, 'timeout 600 bash /scripts/mysql-dump.sh || echo "!! mysql staging dump failed" >&2; exit 0']
              env:
                - name: SET
                  value: tbd-staging-mysql
                - name: DB
                  value: tbd_staging
                - name: APP_USER
                  value: tbd_staging
                # Staging migrates on every backend start, so an empty database means something broke.
                - name: MIN_TABLES
                  value: "1"
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mysql
                      key: backup-password
              securityContext:
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
            - name: pg-dump
              image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
              command: [bash, -c, 'bash /scripts/pg-dump.sh || echo "!! postgres dump failed" >&2; exit 0']
              env:
                # Ziftbook staging data since INFRA-173: an empty dump fails the set.
                - name: MIN_TABLES
                  value: "1"
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: admin-password
              securityContext:
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
            # Ziftbook production (INFRA-82): same script, its own set, after staging's and under a timeout so a hung
            # dump cannot run out the Job's deadline before the uploads. Never fails the pod.
            - name: pg-dump-prod
              image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
              command: [bash, -c, 'timeout 600 bash /scripts/pg-dump.sh || echo "!! postgres production dump failed" >&2; exit 0']
              env:
                - name: SET
                  value: ziftbook-prod-postgres
                - name: DB
                  value: ziftbook_prod
                # Ziftbook production data since INFRA-181: an empty dump fails the set.
                - name: MIN_TABLES
                  value: "1"
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: admin-password
              securityContext:
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
          containers:
            - name: upload
              image: amazon/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
              command: [bash, /scripts/upload.sh]
              env:
                - name: HOME
                  value: /tmp
                # Every set (see the top of this file).
                - name: DUMP_SETS
                  value: tbd-mysql tbd-staging-mysql ziftbook-postgres ziftbook-prod-postgres
                - name: BUCKET
                  value: tbd-mysql-backups-884686184019
                - name: KMS_KEY_ARN
                  value: arn:aws:kms:eu-central-1:884686184019:key/28a8a767-448a-4762-9005-8009bf9e6c22
                - name: AWS_REGION
                  value: eu-central-1
              envFrom:
                - secretRef:
                    name: backup-s3 # k3s-backup-uploader: put + KMS encrypt only
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
            # INFRA-203: the same sets to R2 (terraform/cloudflare/r2.tf), alongside S3 until the move is proven. Runs
            # beside upload, so a failure here never stops the S3 copy; it fails the Job, which reruns both once.
            - name: upload-r2
              image: amazon/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
              command: [bash, /scripts/upload.sh]
              env:
                - name: HOME
                  value: /tmp
                - name: DUMP_SETS
                  value: tbd-mysql tbd-staging-mysql ziftbook-postgres ziftbook-prod-postgres
                - name: BUCKET
                  value: db-backups
                # EU buckets answer only on the .eu endpoint.
                - name: R2_ENDPOINT
                  value: https://fb5eb042529f2621c6de3f34c6801174.eu.r2.cloudflarestorage.com
                - name: AWS_REGION
                  value: auto
              envFrom:
                - secretRef:
                    name: backup-r2 # token db-backups-uploader: Object Read & Write, bucket db-backups only
                    optional: true # missing, only this container fails: the pod still starts and S3 still gets the dumps
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: backup
              # tmpfs: the plaintext dumps (password hashes included) never reach the node's disk (INFRA-205).
              # A set is ~600 KB and counts toward the container's memory limit.
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
            - name: scripts
              configMap:
                name: db-backup
