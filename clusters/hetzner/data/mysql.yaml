# TBD's MySQL. Single replica on local-path storage; nightly dumps are the backup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql
  namespace: data
data:
  # Sized for the 640Mi container limit; each knob below says why it is set.
  tbd.cnf: |
    [mysqld]
    # Ticket budget: the two largest fixed allocations.
    performance_schema = OFF
    innodb_buffer_pool_size = 128M
    # No replica, so binlogs only fill the disk (worst during the INFRA-48 import).
    disable_log_bin
    # X Protocol is unused; saves its listener threads.
    mysqlx = OFF
    # 8.4 defaults: 64M log buffer and a 1G in-memory temptable pool, both too big for 640Mi.
    innodb_log_buffer_size = 8M
    temptable_max_ram = 64M
    # A TBD pod holds up to 22 (pool 5 + overflow 10, rate-limit pool 2 + 5): 2 prod backends and the scheduler = 66,
    # tbd_staging capped at 20 (runbooks.md), plus migrate and the dump job (INFRA-177). Read at start (subPath
    # mount): a change applies at the next MySQL restart.
    max_connections = 120
    # Default 4000 open-table handles; TBD has under 100 tables.
    table_open_cache = 400
    # TBD's MySQL settings.
    character-set-server = utf8mb4
    collation-server = utf8mb4_0900_ai_ci
    # TBD-416: never wait 365 days on a metadata lock.
    lock_wait_timeout = 30
  # Runs once, on an empty datadir only; a failed first boot needs the PVC deleted before it runs again.
  # The image creates tbd and tbd_app (ALL on tbd.*, no GRANT OPTION). Its entrypoint has no SQL escape helper, so escape \ and ' here.
  # tbd_backup gets what mysqldump --single-transaction --routines --triggers --events needs (PROCESS for tablespaces);
  # no REPLICATION CLIENT, since binlog is off and the dump takes no --source-data.
  10-backup-user.sh: |
    pw=${MYSQL_BACKUP_PASSWORD//\\/\\\\}; pw=${pw//\'/\'\'}
    docker_process_sql --database=mysql <<-EOSQL
    CREATE USER 'tbd_backup'@'%' IDENTIFIED BY '${pw}';
    GRANT SELECT, LOCK TABLES, SHOW VIEW, EVENT, TRIGGER, PROCESS ON *.* TO 'tbd_backup'@'%';
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: data
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
---
# Rotate: change the key in mysql.secret.yaml, run ALTER USER ... IDENTIFIED BY via `kubectl -n data exec -it mysql-0 -- mysql -uroot -p`,
# then restart the consumers (tbd-prod holds its own copy of the app password).
# Databases added later (tbd_staging, INFRA-67) are created by hand: docs/runbooks.md "MySQL database per app environment".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: data
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # db-1 only: its local-path storage is the Hetzner volume (ansible db_storage). The PV pins the pod there anyway.
      nodeSelector:
        role: db
      tolerations:
        - key: role
          operator: Equal
          value: db
          effect: NoSchedule
      # InnoDB needs time for a clean shutdown.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
          env:
            # Root only over the in-pod socket; nothing remote logs in as root.
            - name: MYSQL_ROOT_HOST
              value: localhost
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: root-password
            - name: MYSQL_DATABASE
              value: tbd
            - name: MYSQL_USER
              value: tbd_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: app-password
            - name: MYSQL_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: backup-password
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The entrypoint's first-boot server has networking off, so TCP probes wait for the real one.
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [mysqladmin, ping, -h, 127.0.0.1]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [mysqladmin, ping, -h, 127.0.0.1]
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/tbd.cnf
              subPath: tbd.cnf
            - name: config
              mountPath: /docker-entrypoint-initdb.d/10-backup-user.sh
              subPath: 10-backup-user.sh
      volumes:
        - name: config
          configMap:
            name: mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
